  function slug(s){ return String(s||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40); }
  function riskSteps(){
    // Titik risiko = tempat TIS memprediksi user tersendat. Sumber: sintesis walkthrough (perilaku) + verdict run.
    var out=[], seen={};
    function add(name,verdict,why,ev){ var k=slug(name); if(!name||seen[k]) return; seen[k]=1; out.push({step:name,verdict:verdict,why:why||"",evidence:ev||"walkthrough"}); }
    var s=(walkResult&&walkResult.synth)||null;
    if(s){
      if(s.broken_at&&s.broken_at.screen) add(s.broken_at.screen,"broken",s.broken_at.why||s.friction_point||"","walkthrough");
      (s.fixes||[]).forEach(function(f){
        var t=String(f.tier||"").toLowerCase(); if(t!=="blocker"&&t!=="friksi") return;
        var m=/(?:layar|screen|di)\s+['"]([^'"]+)['"]/i.exec(f.what||""); // coba tarik nama layar dari saran
        if(m) add(m[1], t==="blocker"?"broken":"rapuh", f.why||"", f.evidence||"walkthrough");
      });
    }
    // fallback: run yang bingung/gagal nunjuk layar
    (((walkResult||{}).runs)||[]).forEach(function(r){
      if(!r) return;
      (r.steps||[]).forEach(function(st){ if(st&&st.confused&&st.screen) add(st.screen,"rapuh",(r.issue||"user ragu di langkah ini"),"walkthrough"); });
    });
    return out;
  }
  function buildMeasurement(scr){
    var steps=((flowData&&flowData.steps)||[]).slice().sort(function(a,b){return a.depth-b.depth;});
    var jid=(slug(flowProduct)||"produk")+"__"+(slug(flowIntent)||"journey");
    var risks=riskSteps(), riskKeys={}; risks.forEach(function(r){ riskKeys[slug(r.step)]=r; });
    var jv=journeyVerdict();
    var minAcc=(scr&&scr.length)?Math.min.apply(null,scr.map(function(x){return x.acc;})):null;
    return {
      journey_id:jid, product:flowProduct||"", journey:flowIntent||"",
      steps:steps.map(function(s,i){ var r=riskKeys[slug(s.name)]; return { index:i, name:s.name, risk:(r?r.verdict:null) }; }),
      predicted_risk_steps:risks,
      journey_status:(jv?jv.status:null), min_accessibility:minAcc,
      // Atribusi profil: kunci join ke segment-completion-gap setelah rilis.
      // Prediksi "profil X kesulitan di journey ini" nanti diuji lawan completion rate segmen X.
      affected_profiles:(function(){
        var s=(walkResult&&walkResult.synth)||null, seen={}, out=[];
        function add(list){ (list||[]).forEach(function(a){ var k=normProf(a); if(k&&!seen[k]){ seen[k]=1; out.push(k); } }); }
        if(s){ add(s.affected); (s.fixes||[]).forEach(function(f){ add(f.affected); }); }
        return out;
      })(),
      events_funnel:["journey_start","journey_step_view","journey_complete","journey_abandon"],
      events_friction:(risks.length?["ui_rage_tap","ui_dead_tap","journey_backtrack","step_dwell"]:[]),
      session_props:["a11y_font_scale","a11y_screen_reader","a11y_high_contrast","device_tier","network_type"]
    };
  }

  function isDet(f){ return !!(f.cat && f.cat!=="image"); }   // temuan deterministik (bukan gambar)

    for(var i=0;i<src.length;i++){ if(src[i].s==="wcag"){ w=src[i].v; break; } }

  // ---------- Skor: Aksesibilitas (deterministik) + Usability (AKSA) + EQI (payung) ----------
  // Bobot severity: sev3=5, sev2=2, sev1=1. EQI = 100 x (1 - W/(W+100)).
  // PENTING: Aksesibilitas = vonis rule doang → STABIL 100% (dasar gate). Usability = AKSA heuristik → pertimbangan, bisa bervariasi.
  function eqiWeight(sev){ return sev===3?5:sev===2?2:1; }
  function toScore(W){ return Math.round(100*(1 - W/(W+100))); }
  function accScore(){ // Aksesibilitas, rule deterministik saja
    var W=0;
    violations().forEach(function(f){ W+=eqiWeight(f.sev); });
    potentials().forEach(function(f){ W+=0.5*eqiWeight(f.sev); });
    return toScore(W);
  }
  // skor aksesibilitas dari array findings mentah (buat batch scan per-screen di feature submit)
  // Skor aksesibilitas satu layar untuk GATE. Wajib memakai aturan yang SAMA dengan panel,
  // termasuk menghormati temuan yang sudah ditutup desainer. Sebelumnya fungsi ini melewatkan
  // status temuan, jadi angka di panel dan angka di gate bisa berbeda untuk layar yang sama.
  function accFromFindings(items){
    var W=0;
    (items||[]).forEach(function(f){
      if(!isActive(f)) return;
      var w=eqiWeight(f.sev); if(isViol(f)) W+=w; else W+=0.5*w;
    });
    return toScore(W);
  }
  // item aktif yang nempel ke satu dimensi rubrik
  function dimItems(dim){ var out=[]; aiFindings.forEach(function(a,i){ if(aiActive(i) && String(a.dimensi||"").toLowerCase()===dim) out.push(a); }); return out; }
  // STATUS dihitung dari item (deterministik), status dari model diabaikan biar tidak mismatch (baik tapi ada item, dst)
  function dimStatus(dim){ var it=dimItems(dim); if(!it.length) return "baik"; var hi=it.some(function(a){return a.severity==="tinggi";}); if(hi || it.length>=3) return "kurang"; return "cukup"; }
  function usaScore(){ // Usability, status tiap dimensi DIHITUNG dari jumlah/berat item yang nempel (bukan dari klaim model).
    if(aiRubric && aiRubric.length){
      var pen={baik:0,cukup:0.5,kurang:1}, tot=0, n=0;
      aiRubric.forEach(function(r){ tot+=pen[dimStatus(String(r.dimensi||"").toLowerCase())]; n++; });
      return n ? Math.max(0, Math.round(100*(1 - tot/n))) : 100;
    }
    // fallback lama (kalau AKSA tak balik rubrik)
    if(!aiActiveCount()) return null;
    var W=0;
    aiFindings.forEach(function(a,i){ if(aiActive(i)){ var s=a.severity==="tinggi"?3:a.severity==="sedang"?2:1; W+=eqiWeight(s); } });
    return toScore(W);
  }
  // EQI (skor campuran) dipensiunkan. Screen dinilai lewat Skor Aksesibilitas; usability = pengaya; gate = journey + acc floor.
  function scoreCol(v){ return v<50?"#F2586E":v<80?"#E8B600":"#2BA875"; }
  // Gradien angka besar mengikuti pita nilai yang sama dengan scoreCol.
  // Sebelumnya angka selalu emas karena gradiennya dipatok di CSS, jadi 99 dan 55
  // ikut kuning walaupun vonisnya baik dan perlu perbaikan.
  function scoreGrad(v){
    return v<50 ? ["#F2586E","#B0132A"]      // merah, perlu perbaikan
         : v<80 ? ["#FFD84D","#B08A00"]      // emas, cukup
                : ["#2BA875","#2BA875"];     // hijau, baik
  }
  function scoreGlow(v){
    return v<50 ? "rgba(232,0,34,.30)"
         : v<80 ? "rgba(255,200,0,.30)"
                : "rgba(0,142,83,.34)";
  }
  function eqiVerdict(v){ return v<50?"Perlu perbaikan":v<80?"Cukup, bisa ditingkatkan":"Baik"; }
  function subRow(emo,label,note,v){
    var col=v===null?"#9AA0AE":scoreCol(v), val=v===null?"-":v;
    return '<div style="display:flex;align-items:center;gap:8px;margin-top:8px">'+
      '<span style="font-size:14px">'+emo+'</span>'+
      '<div style="flex:1;min-width:0"><div style="font-size:12px;font-weight:700">'+esc(label)+'</div>'+
      '<div style="font-size:10px;color:var(--mut2)">'+esc(note)+'</div></div>'+

  // ---------- Journey verdict = TRUST LADDER ----------
  // Prinsip (benchmark axe/HITL/LLM-judge): cuma sinyal DETERMINISTIK yang nge-gate.
  // Vonis murni-AI = ADVISORY (PERLU CEK), tidak auto-block. Confidence dari konsistensi N-run.
  // Manusia = otoritas final via override (tercatat, jadi bahan kalibrasi).
  function walkConfidence(){
    if(!(walkResult&&walkResult.counts)) return null;
    var c=walkResult.counts, tot=c.total||1;
    var fail=(c.gagal||0)+(c.nyasar||0), maxc=Math.max(c.berhasil||0, c.rapuh||0, fail);
    var level = maxc===tot?"tinggi":(maxc>=tot-1?"sedang":"rendah");
    // Kalau kata task bocor jadi label di layar, kesepakatan antar run tidak berarti banyak.
    // Kelimanya bisa saja benar karena mencocokkan kata yang sama, bukan karena alurnya jelas.
    var lk = walkResult.leak;
    if(lk){
      if(lk.level==="berat" && level==="tinggi") level="sedang";
      else if(lk.level==="berat") level="rendah";
      else if(level==="tinggi") level="sedang";
    }
    // Sebagian run error teknis: sampelnya lebih kecil dari yang dirancang, keyakinan diturunkan.
    if(walkResult.partial && level==="tinggi") level="sedang";
    return {level:level, agree:maxc+"/"+tot+(walkResult.partial?(" dari "+(walkResult.nRuns||tot)+" dijalankan"):""), leak:(lk?lk.level:null)};
  }
  function goalUnreachable(){
    if(!(flowData && flowData.unreachable && flowData.unreachable.length)) return false;
    if(flowGoalId) return flowData.unreachable.some(function(u){return u.id===flowGoalId;});
    return false; // tanpa goal set, unreachable != pasti goal → jangan hard-gate
  }
  function journeyVerdict(ignoreOverride){
    // 0) Override manusia = final
    if(journeyOverride && !ignoreOverride){
      if(journeyOverride.status==="usable") return {status:"PASS", basis:"manusia", gate:false, override:journeyOverride, reason:"ditinjau manusia · usable"+(journeyOverride.reason?", "+journeyOverride.reason:"")};
      return {status:"BROKEN", basis:"manusia", gate:true, override:journeyOverride, reason:"ditinjau manusia · broken"+(journeyOverride.reason?", "+journeyOverride.reason:"")};
    }
    var gu=goalUnreachable(), conf=walkConfidence();
    if(walkResult && walkResult.counts){ var c=walkResult.counts, tot=c.total||1, fail=(c.gagal||0)+(c.nyasar||0), ok=c.berhasil||0;
      if(fail>=Math.ceil(tot/2)){
        if(gu) return {status:"BROKEN", basis:"deterministik", gate:true, confidence:conf&&conf.level, agree:conf&&conf.agree, reason:"struktur buntu (goal tak terjangkau) + mayoritas run gagal"};
        return {status:"PERLU CEK", basis:"ai", gate:false, confidence:conf&&conf.level, agree:conf&&conf.agree, reason:"AKSA menilai gagal, tapi belum ada konfirmasi struktur, tinjau manusia sebelum jadi vonis"};
      }
      if(ok===tot) return {status:"PASS", basis:"ai", gate:false, confidence:conf&&conf.level, agree:conf&&conf.agree, reason:"semua run berhasil menyelesaikan task"};
      return {status:"RAPUH", basis:"ai", gate:false, confidence:conf&&conf.level, agree:conf&&conf.agree, reason:"hasil campur, task tercapai lewat jalur tak intuitif"};
    }
    if(flowData && flowData.wired){
      if(gu) return {status:"BROKEN", basis:"deterministik", gate:true, reason:"layar tujuan tak terjangkau dari start (unreachable)"};
      if(flowData.deadends && flowData.deadends.length>1) return {status:"PERLU CEK", basis:"struktur", gate:false, reason:flowData.deadends.length+" layar buntu, cek jalan keluarnya"};
      return {status:"BELUM DIUJI", basis:null, gate:false, reason:"jalankan Task Walkthrough untuk verdict"};
    }
    return {status:"UNKNOWN", basis:null, gate:false, reason:"belum ada journey dianalisa"};
  }

    var grup=[["Penglihatan","vision"],["Screen reader","blind"],["Motorik","motor"],["Literasi","lowlit"]];

  function renderPersonaRuns(R, pk, kk){

        (r.error?(' · '+esc(r.error)):(' · '+esc(r.status||"")+' · mundur '+r.backs+(r.tebak?' · menebak '+r.tebak:'')+(r.salahTekan?' · meleset '+r.salahTekan:'')))+'</div>';

      if(c==='"'){ inStr=true; continue; }
      if(c==="{") stack.push("}"); else if(c==="[") stack.push("]");
      else if(c==="}"||c==="]") stack.pop();

                         memori:memoriTeks(), meleset:meleset, canBack:hist.length>0, layarKe:(Object.keys(kunjung).length) });
      meleset=false;
      return simImage(sh, view.rg, job.kendala).then(function(b64){
        var content=[{type:"text", text:view.text}];
        if(b64 && job.kendala!=="screenreader") content.push({type:"image", source:{type:"base64", media_type:"image/png", data:b64}});
        var body=JSON.stringify({ model:MODEL, max_tokens:700, thinking:{type:"disabled"}, system:PERSONA_SYS, messages:[{role:"user", content:content}] });
        return apiFetch(body);
      }).then(function(res){
        var d=null; try{ d=JSON.parse(res.t); }catch(e){}
        if(!d || d.error || !d.content){ throw new Error((d&&d.error&&(d.error.message||d.error.type))||("HTTP "+(res.r&&res.r.status))); }
        var txt=""; d.content.forEach(function(c){ if(c.type==="text"&&c.text) txt+=c.text; });
        var o=parseObj(txt)||{};
        var ak=parseAksi(o.aksi, view.daftar.length);
        var st={ layar:(sh.name||""), lihat:String(o.lihat||""), pikir:String(o.pikir||""), aksi:ak.k, label:"",
                 confused:!!o.confused, guessed:!!o.guessed, meleset:false, bagian:view.rg.nama };
        if(o.ingat) notes.push(String(o.ingat).slice(0,140));
        if(st.confused) ragu++;
        if(ak.k==="aksi"){
          var pilih=view.daftar[ak.i], a=pilih.a; st.label=pilih.label;
          if(st.guessed) tebak++;
          // KENDALA MOTORIK: peluang meleset dari UKURAN target dan jarak ke tetangga, diundi kode.
          if(job.kendala==="motorik" && a.box){
            var kecil=Math.min(a.box.w, a.box.h), p=kecil<24?0.35:kecil<44?0.15:0;
            var tetangga=(node.actions||[]).filter(function(b){ return b!==a && b.box && b.toId!==a.toId && boxGap(a.box,b.box)<=8; });
            if(p>0 && tetangga.length && rnd()<p){
              a=tetangga[Math.floor(rnd()*tetangga.length)]; st.meleset=true; salahTekan++; meleset=true;
            }
          }
          hist.push(cur); fwd++; cur=a.toId; region=0;
        } else if(ak.k==="kembali"){
          if(hist.length){ cur=hist.pop(); backs++; region=0; } else { st.aksi="invalid"; nInvalid++; }
        } else if(ak.k==="gulir"){
          region=(region+1)%Math.max(1,view.regions.length);
        } else if(ak.k==="selesai"){
          steps.push(st);
          status = job.goalId ? (cur===job.goalId ? "sampai" : "salah-layar") : "klaim-selesai";
          return null;
        } else if(ak.k==="menyerah"){
          steps.push(st); status="menyerah"; return null;
        } else { nInvalid++; if(nInvalid>=3){ steps.push(st); status="tak-terbaca"; return null; } }
        steps.push(st);
        return langkah(i+1);
      });
    }
    return langkah(0).then(function(){
      return { persona:job.persona, kendala:job.kendala, run:job.run, status:status, steps:steps,
               backs:backs, fwd:fwd, tebak:tebak, ragu:ragu, salahTekan:salahTekan, akhir:(byShot[cur]&&byShot[cur].name)||"" };
    }, function(err){
      return { persona:job.persona, kendala:job.kendala, run:job.run, error:pesanJaringanPendek(err), steps:steps };
    });
  }
  function pesanJaringanPendek(err){ return String((err&&err.message)||err||"error").slice(0,160); }
  // Tangga vonis yang sama dengan walkthrough: sampai lewat tebakan = gagal.
  function simVerdict(r){
    if(r.error) return "error";
    if(r.status==="sampai"){
      if(r.tebak>0) return "gagal";
      if(r.ragu>0 || r.backs>0 || r.salahTekan>0) return "rapuh";
      return "berhasil";
    }
    if(r.status==="klaim-selesai") return "klaim";
    if(r.status==="dibatalkan") return "dibatalkan";
    if(r.status==="menyerah" || r.status==="tak-terbaca") return "gagal";
    return "nyasar";   // salah-layar, berputar, langkah-habis, luar-cakupan
  }
  // Ringkasan per kombinasi persona × kendala, dihitung deterministik dari jejak run.
  function personaSummary(runs, combos, N){
    var out=combos.map(function(c){
      var rs=runs.filter(function(r){ return r.persona===c.p && r.kendala===c.k; });
      var ok=rs.filter(function(r){ return !r.error && r.status!=="dibatalkan"; });
      var v={berhasil:0,rapuh:0,gagal:0,nyasar:0,klaim:0};
      ok.forEach(function(r){ var x=simVerdict(r); if(v[x]!==undefined) v[x]++; });
      var back=0, fwd=0, langkah=0; ok.forEach(function(r){ back+=r.backs; fwd+=r.fwd; langkah+=r.steps.length; });
      var titik={}; ok.forEach(function(r){ var x=simVerdict(r); if(x==="gagal"||x==="nyasar"){ var s=(r.steps[r.steps.length-1]||{}).layar||r.akhir||"?"; titik[s]=(titik[s]||0)+1; } });
      var tg=Object.keys(titik).sort(function(a,b){ return titik[b]-titik[a]; })[0]||null;
      return { persona:c.p, kendala:c.k, profil:(KNOWLEDGE.kendala[c.k]||{}).profil||null,
               n:ok.length, error:rs.length-ok.length, v:v, sampai:v.berhasil+v.rapuh,
               rasio_mundur:(fwd?Math.round(back/fwd*100)/100:0), rata_langkah:(ok.length?Math.round(langkah/ok.length*10)/10:0),
               titik_gagal:tg, cukup:(ok.length>=Math.ceil(N/2)) };
    });
    var adaKendala=combos.some(function(c){ return c.k!=="normal"; });
    // BELUM LENGKAP: simulasi tanpa satu pun kendala inklusif tidak boleh dianggap selesai.
    return { kombinasi:out, lengkap:adaKendala, catatan:(adaKendala?"":"BELUM LENGKAP: jalankan minimal satu kendala inklusif, standarnya Teks 200%.") };
  }
  function personaJourneySig(){ return (flowStartId||"")+"|"+(flowGoalId||"")+"|"+((flowIntent||"").trim()); }
  function personaCombos(){
    var out=[]; personaSel.forEach(function(p){ kendalaSel.forEach(function(k){ out.push({p:p,k:k}); }); });
    return out;
  }
  function personaScreenIds(){
    var st=(flowData&&flowData.steps)?flowData.steps.slice():[];
    var ids=journeyPath(flowData&&flowData.startId, flowGoalId);
    st.forEach(function(s){ if(ids.length<PERSONA_CAP && ids.indexOf(s.id)<0) ids.push(s.id); });
    if(flowGoalId && ids.indexOf(flowGoalId)<0) ids.push(flowGoalId);
    if(flowData && flowData.startId && ids.indexOf(flowData.startId)<0) ids.unshift(flowData.startId);
    return ids;

  function personaEstimate(){
    var nLayar=Math.min(personaScreenIds().length, PERSONA_CAP);
    var perRun=Math.min(SIM_MAX_STEPS, Math.max(3, Math.min(nLayar+2, 8)));
    return { kombinasi:personaCombos().length, run:personaCombos().length*personaN, panggilan:personaCombos().length*personaN*perRun };

  function runPersonaSim(shots, sig, combos, N){
    if(sig!==personaJourneySig()){ personaRunning=false; render(); return; }   // journey sudah berganti
    var byShot={}; (shots||[]).forEach(function(s){ byShot[s.id]=s; });
    var byNode={}; ((flowData&&flowData.graph)||[]).forEach(function(g){ if(g.id) byNode[g.id]=g; });
    _bmpCache={};
    var jobs=[]; combos.forEach(function(c){ for(var r=0;r<N;r++) jobs.push({ persona:c.p, kendala:c.k, run:r, sig:sig, intent:(flowIntent||"").trim(),
      startId:(flowData&&flowData.startId), goalId:flowGoalId, shots:byShot, nodes:byNode }); });
    var hasil=[], idx=0, aktif=0;
    personaProg={ done:0, total:jobs.length };
    return new Promise(function(selesai){
      function next(){
        if(idx>=jobs.length || personaCancel){ if(aktif===0) selesai(); return; }
        var job=jobs[idx++]; aktif++;
        simRun(job).then(function(r){ hasil.push(r); aktif--; personaProg.done++; render(); next(); });
      }
      for(var i=0;i<Math.min(SIM_POOL, jobs.length);i++) next();
      if(!jobs.length) selesai();
    }).then(function(){
      personaRunning=false;
      if(sig!==personaJourneySig()){ render(); return; }   // user ganti journey selama berjalan
      var ringkas=personaSummary(hasil, combos, N);
      personaResult={ sig:sig, intent:(flowIntent||"").trim(), goal:flowGoalId, N:N, combos:combos, runs:hasil, ringkas:ringkas,
                      dibatalkan:!!personaCancel, model:MODEL, waktu:new Date().toISOString(), knowledge:KNOWLEDGE.versi };
      if(!personaCancel) personaCache[sig+"|"+JSON.stringify(combos)+"|"+N]=personaResult;
      personaCancel=false;
      render();
    });
  }

  function parseFlow(text){
    var t=(text||"").replace(/```json/gi,"").replace(/```/g,"").trim();
    var a=t.indexOf("["); if(a>=0) t=t.slice(a);
    var b=t.lastIndexOf("]"); var whole=(b>0)?t.slice(0,b+1):t;
    try{ var arr=JSON.parse(whole); if(Array.isArray(arr)) return arr; }catch(e){}
    // Salvage: ambil objek {...} lengkap satu per satu (kalau array kepotong / truncated)
    var out=[], depth=0, start=-1, inStr=false, escp=false;
    for(var i=0;i<t.length;i++){ var ch=t[i];
      if(inStr){ if(escp){escp=false;} else if(ch==="\\"){escp=true;} else if(ch==='"'){inStr=false;} continue; }
      if(ch==='"'){ inStr=true; continue; }
      if(ch==="{"){ if(depth===0) start=i; depth++; }
      else if(ch==="}"){ if(depth>0){ depth--; if(depth===0 && start>=0){ try{ out.push(JSON.parse(t.slice(start,i+1))); }catch(e){} start=-1; } } }
    }
    return out;
  }
  function runFlowAksa(shots){
    if(!shots.length){ skFlowLoading=false; flowFindings=[{aspek:"info",status:"perlu-perhatian",catatan:"Tidak ada frame untuk dianalisa.",saran:"Wire prototype & pilih tujuan."}]; render(); return; }
    var myFlowSig = pendingFlowSig;
    var order = flowGoalId ? "start → tujuan" : "start → layar terdalam";
    var content=[{type:"text",text:"Tujuan journey: "+((flowIntent&&flowIntent.trim())?flowIntent:"(tak diisi, tebak dari layar)")+"\nUrutan "+shots.length+" layar ("+order+"). Nilai kualitas journey-nya relatif tujuan."}];
    shots.forEach(function(s,i){ content.push({type:"text",text:"Layar "+(i+1)+": "+(s.name||"")}); content.push({type:"image",source:{type:"base64",media_type:"image/png",data:toB64(s.bytes)}}); });
    aiSend({model:MODEL_JUDGE,max_tokens:3600,thinking:{type:"disabled"},system:FLOW_SYS,messages:[{role:"user",content:content}]}).then(function(res){ var t=res.t;
      if(myFlowSig!==pendingFlowSig) return;   // journey sudah berganti selama analisa
      skFlowLoading=false;
      var d=null; try{ d=JSON.parse(t); }catch(e){}
      if(!d){ flowFindings=[{aspek:"error",status:"masalah",catatan:"Respons tidak terbaca.",saran:t.slice(0,160)}]; render(); return; }
      if(d.error){ flowFindings=[{aspek:"error",status:"masalah",catatan:(d.error.message||"error"),saran:"Cek token & koneksi."}]; render(); return; }
      var txt=""; if(d.content) d.content.forEach(function(c){ if(c.type==="text"&&c.text) txt+=c.text; });
      flowFindings=parseFlow(txt);
      if(!flowFindings.length) flowFindings=[{aspek:"info",status:"perlu-perhatian",catatan:"AKSA tidak balik hasil terstruktur.",saran:(txt.slice(0,160)||"Coba lagi.")}];
      else if(pendingFlowSig){ flowCache[pendingFlowSig]=flowFindings; }
      render();
    }).catch(function(err){ skFlowLoading=false; flowFindings=[{aspek:"error",status:"masalah",catatan:pesanJaringan(err),saran:"Lihat langkah pengecekan di catatan."}]; render(); });
  }

  // ambil objek {...} lengkap dari potongan teks setelah '[' (berhenti di ']' level-0)
  function salvageObjs(seg){ var out=[],depth=0,start=-1,inStr=false,escp=false;
    for(var i=0;i<seg.length;i++){ var ch=seg[i];
      if(inStr){ if(escp)escp=false; else if(ch==="\\")escp=true; else if(ch==='"')inStr=false; continue; }
      if(ch==='"'){inStr=true;continue;}
      if(ch==="{"){ if(depth===0)start=i; depth++; }
      else if(ch==="}"){ if(depth>0){depth--; if(depth===0&&start>=0){ try{out.push(JSON.parse(seg.slice(start,i+1)));}catch(e){} start=-1;}} }
      else if(ch==="]"&&depth===0){ break; }
    } return out; }
  function arrAfter(t,key){ var k=t.indexOf('"'+key+'"'); if(k<0) return []; var b=t.indexOf("[",k); if(b<0) return []; return salvageObjs(t.slice(b+1)); }
  function parseAi(text){
    var t=(text||"").replace(/```json/gi,"").replace(/```/g,"").trim();
    var out={content:"",intent:"",findings:null,rubric:null};
    // 1) coba object utuh
    var om=t.match(/\{[\s\S]*\}/);
    if(om){ try{ var o=JSON.parse(om[0]); if(o){ out.content=o.content_guess||o.content||""; out.intent=o.intent_guess||o.intent||"";
      if(Array.isArray(o.findings)) out.findings=o.findings;
      if(Array.isArray(o.usability_rubric)) out.rubric=o.usability_rubric; else if(Array.isArray(o.rubric)) out.rubric=o.rubric; } }catch(e){} }
    // 2) salvage TERPISAH (tahan truncation): rubric & findings tetap kebaca walau object kepotong
    if(!out.rubric||!out.rubric.length){ var rub=arrAfter(t,"usability_rubric"); if(rub.length) out.rubric=rub; }
    if(!out.findings||!out.findings.length){ var fnd=arrAfter(t,"findings"); if(fnd.length) out.findings=fnd; }
    if(!out.content){ var cg=t.match(/"content_guess"\s*:\s*"([^"]*)"/); if(cg) out.content=cg[1]; }
    if(!out.intent){ var ig=t.match(/"intent_guess"\s*:\s*"([^"]*)"/); if(ig) out.intent=ig[1]; }
    // 3) fallback: model balik array findings saja
    if(!out.findings){ var am=t.match(/\[[\s\S]*\]/); if(am){ try{ var a=JSON.parse(am[0]); if(Array.isArray(a)) out.findings=a; }catch(e){} } }
    return out;
  }

    skLoading=true; skRaw=""; aiFindings=[]; aiState={}; aiRubric=null; ctxGuessed=false; render();
    var list=findings.map(function(f){return "- "+f.title+" ("+f.name+")";}).join("\n")||"(tidak ada temuan deterministik)";
    var nmap=nodeMap.map(function(n){return n.id+" | "+n.type+" | "+n.name;}).join("\n");
    var content=[{type:"text",text:
      "Layar/frame: "+(lastFrame||"?")+
      "\nKonten halaman: "+(aiCtx.content||"(tak diisi)")+
      "\nIntensi halaman: "+(aiCtx.intent||"(tak diisi)")+
      "\n\nTemuan rule (JANGAN diulang):\n"+list+
      "\n\nDaftar elemen (id | tipe | teks/nama, untuk TEXT, isinya teks ASLI dalam tanda kutip):\n"+nmap+
      "\n\nAnalisa GAMBAR frame ini untuk hal yang rule TIDAK bisa tangkap: (a) aksesibilitas kontekstual (makna ikon, label ambigu, urutan baca, hierarki, reading level/jargon, dark pattern) DAN (b) usability & UX-psychology (progressive disclosure, Hick's/Miller's/cognitive load, recognition-over-recall, aesthetic-usability effect, Von Restorff/penonjolan CTA, Law of Proximity/pengelompokan, Law of Similarity/konsistensi, focal point/hierarki). Gunakan Konten & Intensi halaman biar saran nyambung, bukan generik. "+
      "Untuk tiap temuan tunjuk elemen paling relevan lewat 'node' (id PERSIS dari daftar). COCOKKAN lewat teks/nama: kalau temuan soal teks tertentu (mis. 'Rp0'), pilih node yang teksnya PERSIS \"Rp0\", BUKAN teks lain. Pakai id BERBEDA & spesifik tiap temuan; jangan pakai id kontainer besar yang sama; kalau tak yakin elemennya, KOSONGKAN 'node'. Prioritaskan dampak ke lansia/tunanetra/low-literacy/motorik. "+
      "Kalau 'Konten halaman' atau 'Intensi halaman' di atas KOSONG/(tak diisi), TEBAK dari gambar & nama layer (1 kalimat masing-masing). "+
      "WAJIB isi 'usability_rubric': nilai USABILITY layar ini per HEURISTIK NIELSEN dari GAMBAR, INDEPENDEN dari jumlah 'findings'. Ini dipakai buat SKOR, jadi harus JUJUR & TEGAS, JANGAN default 'baik'. Status 'kurang' kalau ada masalah nyata, 'cukup' kalau ada gesekan tapi masih jalan, 'baik' HANYA kalau memang rapi. Ke-6 dimensi WAJIB dinilai semua (tiap dimensi berlandaskan heuristik Nielsen): hierarki-visual (#8 minimalist, ada titik fokus & urutan jelas?), kejelasan-label (#2 match real world / #6 recognition, teks tombol/menu dimengerti awam, bukan jargon?), beban-kognitif (#6 recognition (jumlah pilihan/info wajar, tidak overwhelming?), konsistensi (#4) pola/gaya/istilah konsisten & ikut konvensi?), penonjolan-aksi (#1 status / #8 / Von Restorff, KALIBRASI ke INTENT halaman: kalau halaman TASK/keputusan (checkout, form, detail produk, konfirmasi), aksi utama HARUS paling menonjol & status jelas; TAPI kalau halaman KATALOG/BROWSE/SEARCH/eksplorasi (user cari-cari & bandingkan banyak item), TIDAK wajib ada satu CTA dominan, memaksa satu tombol hero justru salah karena item harus setara. Di halaman jelajah nilai 'baik' kalau: item jelas bisa di-tap/interaktif, kartu konsisten, filter/sort & path ke detail obvious. Turunkan HANYA kalau user bingung mana yang bisa diklik atau gimana cara lanjut, JANGAN karena tak ada satu tombol menonjol), alur-baca (#8, urutan baca natural atas→bawah?). Kalau aksesibilitas dasar buruk (kontras rendah, hierarki datar), itu MENURUNKAN hierarki-visual & kejelasan-label, jangan kasih 'baik'. "+
      "RUBRIK = RAPOR: tiap dimensi HANYA 'status' + 'alasan' (1 kalimat), TANPA saran, TANPA cara benerin. Cara benerin SEMUA dipindah ke 'findings'. Alasan tiap dimensi harus BEDA & fokus ke aspek dimensi itu; JANGAN ke-6 alasan menunjuk root cause yang sama (mis. jangan semua bilang 'layar padat'). "+
      "PENTING: 'status' yang kamu isi cuma HINT, status FINAL dihitung sistem dari jumlah & berat ITEM yang nempel ke dimensi itu (0 item = baik; ada item = cukup; item berat/banyak = kurang). Jadi konsekuensinya: kalau ADA yang layak dibenahi di sebuah dimensi, kamu WAJIB emit item-nya, JANGAN ditutupi dengan bilang 'baik'. Kalau dimensi memang beres, JANGAN emit item apa pun untuk dimensi itu (item = sinyal ada masalah). 'alasan' tulis netral menggambarkan kondisi, bukan sekadar klaim 'sudah baik'. "+
      "KEPADATAN, kalibrasi ke TIPE user: kalau layar ini alat kerja internal / power-user (mis. mitra/agent yang pakai berulang tiap hari), kepadatan info yang TERORGANISIR itu WAJAR & efisien (Jakob/efficiency), JANGAN otomatis turunkan beban-kognitif/hierarki jadi 'cukup' cuma karena banyak elemen; nilai 'baik' kalau padat TAPI terkelompok rapi & ada titik fokus jelas. Turunkan HANYA kalau kepadatan itu benar-benar bikin bingung/lambat. "+
      "KALIBRASI HIERARKI & FOCAL POINT (anti over-reach Von Restorff): 'titik fokus bersaing' itu masalah HANYA kalau dua elemen berebut perhatian untuk KEPUTUSAN/AKSI YANG SAMA. JANGAN emit finding kalau: (a) aksi utama SUDAH jelas paling menonjol (mis. CTA merah solid full-width), dilarang protes 'saingan focal kedua' sebagai masalah; ATAU (b) elemen yang 'bersaing' BEDA FUNGSI & JELAS DILABELI (mis. kartu 'riwayat/terakhir dibeli' vs kartu 'rekomendasi'), user tak memilih di antara keduanya, differensiasi lewat LABEL sudah cukup. Dua kartu berbobot visual mirip TAPI fungsi & label beda = BUKAN pelanggaran hierarki, biarkan 'baik'. "+
      "KALIBRASI PENONJOLAN AKSI, 'aksi' TIDAK harus berbentuk tombol: di daftar/kartu/baris, ELEMEN ITU SENDIRI sering JADI target tap (pola standar). Sebelum bilang 'tidak ada aksi', pertimbangkan kemungkinan kartu/baris-nya tappable. Kamu TIDAK bisa memverifikasi tappable dari gambar statis, jadi DILARANG vonis 'tidak ada tombol/aksi' seolah fakta; kalau memang cue-nya kurang, framing yang BENAR = 'kartu belum kelihatan bisa ditap, tambahkan cue (chevron ›, harga sebagai link, atau state pressable)', BUKAN 'tambahkan tombol di tiap kartu' (nambah 3+ tombol setara justru bikin bersaing & berat). "+
      "KREDIT MEKANISME FOKUS NON-TOMBOL (WAJIB): fokus bisa diarahkan TANPA tombol dominan, lewat Law of Common Region (bidang warna/kartu yang ngelompokin satu zona, mis. background berwarna di section rekomendasi), badge/label pembeda (Von Restorff, mis. 'Paling Untung'/'Paling Cocok'), ukuran & urutan. Kalau mekanisme ini SUDAH ADA dan efektif, AKUI di 'alasan' dan JANGAN nilai penonjolan-aksi rendah cuma karena tak ada tombol. Turunkan HANYA kalau user beneran tak tahu CARA melanjutkan setelah menentukan pilihan (gulf of execution), dan sebut itu sebagai masalah CARA LANJUT, bukan masalah 'tidak ada CTA dominan'. "+
      "ANTI-OSILASI (jangan bikin whack-a-mole): DILARANG mengeluarkan finding yang cuma memindahkan masalah ke dimensi lain, dan DILARANG mengusulkan saran yang efek sampingnya bakal kamu flag sendiri di scan berikutnya. Sebelum menulis 'saran', bayangkan hasilnya: kalau bentuk barunya bakal kamu tuduh melanggar dimensi lain, berarti sarannya SALAH, perbaiki sarannya, jangan emit finding-nya. Contoh konkret: (a) konten panjang terbuka default → saran yang benar = 'default collapsed, TANPA preview terpotong; cukup LABEL yang self-explanatory + chevron'. JANGAN nyaranin 'preview satu baris' lalu nanti flag preview itu ambigu. (b) POTONGAN TEKS ber-ellipsis (…) di baris disclosure yang collapsed itu POLA STANDAR, dan BUKAN 'label', nilai kejelasan-label dari LABEL/JUDUL barisnya (mis. 'Skrip Jualan (siap dibacakan)'), BUKAN dari fragmen kalimat yang kepotong; kalau labelnya sudah jelas, JANGAN flag kejelasan-label cuma karena preview-nya kepotong. (c) Kalau layar sudah menerapkan pola yang benar (collapsed, ringkas, terkelompok), akui beres, jangan cari sisi lain buat tetap dikomentari. "+
      "KALIBRASI KONSISTENSI (anti-inversi heuristik): memakai AFORDANSI STANDAR yang SAMA (chevron = expand/collapse, hamburger = menu, ›/panah = lanjut, dots = menu-lain) untuk BANYAK elemen yang semuanya melakukan interaksi SEJENIS (buka/tutup konten) itu KONSISTENSI yang BENAR (Nielsen #4 / Jakob), JANGAN dibalik jadi 'masalah' cuma karena konten di baliknya beda kedalaman/konteks. DILARANG menyarankan bikin varian ikon berbeda per-item (mis. chevron abu vs chevron merah per 'level'), itu justru MENAMBAH inkonsistensi & beban belajar. Konsistensi baru DILANGGAR kalau: (a) aksi logis yang SAMA tampil/berperilaku BEDA antar-layar; ATAU (b) kontrol yang tampak identik menuju hasil BERISIKO/ireversibel yang beda TANPA label pembeda. Kalau tiap kontrol sudah punya LABEL teks jelas yang ngebedain fungsinya (mis. 'Paket Terakhir Dibeli', 'Skrip Jualan', 'Lihat rincian'), ikon yang sama itu WAJAR, jangan flag. "+
      "PENTING, skor harus RESPONSIF ke perbaikan: kalau layar SUDAH menerapkan solusi (mis. bahasa lugas, langkah/stepper jelas, ekspektasi di-set, kontras info dinaikkan), NAIKKAN status heuristik terkait ke 'baik'; JANGAN tetap 'cukup' kalau masalahnya memang sudah teratasi. Nilai apa yang KAMU LIHAT sekarang, bukan asumsi lama. "+
      "KONSISTENSI, nilai TEGAS & DETERMINISTIK berdasarkan ambang objektif ini, bukan feeling, biar hasilnya SAMA tiap kali layar yang sama dinilai: 'baik' = tidak ada masalah yang mengganggu tugas utama; 'cukup' = ada 1 gesekan tapi tugas masih selesai; 'kurang' = ada ≥2 gesekan ATAU 1 blocker yang bikin user bisa gagal/salah. Kalau ragu antara dua status, pilih yang LEBIH BURUK (konservatif). Jangan mengarang variasi antar-scan. "+
      "SARAN harus TAJAM & bisa langsung dikerjakan, pola 3 bagian: (1) ELEMEN persis yang diubah, (2) PERUBAHAN konkret (angka/teks/urutan spesifik, bukan 'perjelas'/'perbaiki' saja), (3) HASIL yang diharapkan buat user. Contoh: 'Ubah tombol \"Lanjut\" jadi \"Bayar Rp50.000\" biar user tahu nominal sebelum klik, kurangi ragu.' Hindari saran normatif tanpa arah. "+
      "AMBANG DAMPAK (PALING PENTING, biar hasil MENGERUCUT, bukan whack-a-mole): HANYA emit finding kalau masalahnya BENAR-BENAR bikin user prioritas (lansia/low-literacy/awam) KESULITAN NYATA menyelesaikan tugas, gagal, salah, atau ragu berarti. JANGAN emit 'nice-to-have', penyempurnaan kosmetik, preferensi gaya, atau optimasi minor (mis. 'tambah 1 baris preview', 'bisa lebih menonjol dikit', 'akan lebih baik kalau'). Kalau sebuah dimensi sudah USABLE walau belum sempurna, biarkan 0 item = 'baik'. Tujuanmu BUKAN kesempurnaan, tapi 'cukup usable buat dipakai'. JANGAN cari-cari kekurangan demi keliatan teliti, layar yang sudah beres WAJIB kamu akui beres (0 item). Ambang: kalau kamu ragu 'ini masalah nyata atau cuma bisa lebih baik?', berarti BUKAN masalah, JANGAN emit. "+
      "'findings' = SATU-SATUNYA daftar aksi (rubrik tidak kasih saran). DEDUP KERAS: satu ROOT CAUSE = SATU finding saja. Kalau satu masalah (mis. 'kartu Skrip Jualan default terbuka') menyentuh beberapa dimensi, tulis SEKALI saja, pilih dimensi paling relevan; JANGAN bikin finding terpisah untuk masalah yang sama. TAMPILKAN SEMUA masalah yang LOLOS AMBANG DAMPAK (yang benar-benar nyusahin user prioritas), boleh BEBERAPA per dimensi, urut dari paling penting. Panduan: maks ~3 per dimensi & ~10 total; kalau satu dimensi punya 1 masalah nyata ya 1, kalau punya 3 ya tampilkan 3. TETAP patuh AMBANG DAMPAK (jangan nice-to-have) & DEDUP (satu root cause sekali), jadi 'semua yang penting' BUKAN 'semua yang bisa dikomentari'. "+
      "Tiap finding WAJIB punya field 'dimensi' = dimensi rubrik yang temuan ini perbaiki, salah satu dari: hierarki-visual|kejelasan-label|beban-kognitif|konsistensi|penonjolan-aksi|alur-baca. Kalau temuan soal aksesibilitas kontekstual (makna ikon, jargon, kontras makna) atau dark-pattern yang TIDAK cocok ke 6 dimensi itu, isi 'dimensi':\"lain\". Ini dipakai buat nempel finding di bawah dimensi rubrik yang tepat. "+
      "KONSISTENSI STATUS ↔ ITEM (WAJIB, ini yang paling penting): setiap dimensi yang status-nya 'cukup' atau 'kurang' HARUS punya minimal 1 finding ber-'dimensi' sama yang jelasin masalah + cara benerinnya, JANGAN ada dimensi 'cukup'/'kurang' tanpa finding. Sebaliknya, dimensi yang 'baik' TIDAK BOLEH punya finding apa pun, kalau kamu masih nemu sesuatu yang layak dibenahi di dimensi itu, berarti status-nya BUKAN 'baik', turunkan ke 'cukup'. Jadi: 'baik' = 0 item, 'cukup'/'kurang' = ada item. Jumlah & berat item harus nyambung sama status (makin banyak/berat masalah → status makin rendah). "+
      "ATURAN 'saran' finding (WAJIB): TAJAM & bisa langsung dikerjakan, pola 3 bagian, (1) ELEMEN persis (kutip teks/label aslinya), (2) PERUBAHAN konkret & SPESIFIK (tulis teks/angka/urutan/komponen barunya, mis. 'ganti jadi \"Bayar Rp50.000\"', 'pindah tombol ke bawah harga', 'default collapsed'), (3) HASIL buat user (mis. 'ringkasan harga kelihatan dulu tanpa scroll'). DILARANG vague ('perjelas', 'perbaiki', 'buat lebih menonjol', 'sederhanakan') tanpa elemen + perubahan persis. "+
      "Balas HANYA JSON object, TANPA ``` dan tanpa teks lain. Bentuk: {\"content_guess\":\"konten halaman 1 kalimat\",\"intent_guess\":\"intensi halaman 1 kalimat\",\"usability_rubric\":[{\"dimensi\":\"hierarki-visual|kejelasan-label|beban-kognitif|konsistensi|penonjolan-aksi|alur-baca\",\"status\":\"baik|cukup|kurang\",\"alasan\":\"1 kalimat kenapa, fokus aspek dimensi ini\"}],\"findings\":[ ... ]}. 'usability_rubric' WAJIB berisi ke-6 dimensi, TANPA 'saran'. 'findings' = semua masalah yang lolos ambang dampak (boleh beberapa per dimensi, panduan maks ~3/dimensi & ~10 total), sudah di-dedup; SETIAP finding WAJIB punya 'title' ringkas (nyatakan MASALAHnya, JANGAN kosong) + 'catatan' 1–2 kalimat (sebut NAMA prinsip kalau usability + SIAPA yang kesulitan) + 'dimensi'. JANGAN kirim finding yang cuma berisi 'saran' tanpa title/catatan. Skema item: {\"title\":\"ringkas\",\"dimensi\":\"hierarki-visual|kejelasan-label|beban-kognitif|konsistensi|penonjolan-aksi|alur-baca|lain\",\"target_text\":\"teks PERSIS elemen yang dimaksud (kutip apa adanya kalau elemen teks; kosong kalau bukan teks)\",\"node\":\"<id elemen atau kosong>\",\"area\":\"nama elemen\",\"severity\":\"tinggi|sedang|rendah\",\"kategori\":\"ikon|label|urutan-baca|hierarki|bahasa|dark-pattern|usability|cognitive-load|progressive-disclosure|aesthetic-usability\",\"catatan\":\"kenapa ini masalah + siapa yang kesulitan (1 kalimat)\",\"saran\":\"pola 3 bagian WAJIB: elemen persis + perubahan konkret & spesifik + hasil buat user; DILARANG vague\"}."}];
    // rekam prompt analisa yang benar-benar dirakit, buat pemeriksa integritas knowledge
    try{ lastAnalyzePrompt = content.map(function(x){ return x.type==="text" ? x.text : ""; }).join(" "); }catch(e){}
    if(previewB64) content.push({type:"image",source:{type:"base64",media_type:"image/png",data:previewB64}});
    aiSend({model:MODEL_JUDGE,max_tokens:5200,thinking:{type:"disabled"},system:SYS,messages:[{role:"user",content:content}]})
      .then(function(rr){ var res={ok:rr.r.ok,status:rr.r.status,body:rr.t};
        var d=null; try{d=JSON.parse(res.body);}catch(e){}
        if(!d || d.error){ skRaw = pesanGagal(res.status, d, res.body); }
        else { var text=""; if(d.content&&d.content.length){ d.content.forEach(function(b){ if(b.type==="text"&&b.text) text+=b.text; }); }
          var parsed=parseAi(text);
          // User sudah pindah frame selama analisa: simpan di bawah frame ASALNYA, jangan tampilkan
          // di frame yang sekarang. Dulu hasil frame A di-cache dengan kunci frame B.
          if(parsed && lastFrame!==frameAt){ aiCache[hkey]={f:parsed.findings||[],r:parsed.rubric||null}; skLoading=false; render(); return; }
          if(parsed && ((parsed.findings&&parsed.findings.length) || (parsed.rubric&&parsed.rubric.length))){ aiFindings=parsed.findings||[]; aiRubric=parsed.rubric||null;
            if(ctxWasEmpty){ if(parsed.content) aiCtx.content=parsed.content; if(parsed.intent) aiCtx.intent=parsed.intent; ctxGuessed=true; }
            aiCache[hkey]={f:aiFindings,r:aiRubric}; aiCache[hashFrame()]={f:aiFindings,r:aiRubric};
          } else { skRaw = text ? text : ("Model balik tanpa teks (stop_reason: "+(d.stop_reason||"?")+"). Respons: "+JSON.stringify(d).slice(0,500)); } }
        skLoading=false; render();
      }).catch(function(err){ skRaw=pesanJaringan(err); skLoading=false; render(); });
  }

  // ---------- events ----------
  document.body.addEventListener("click",function(e){
    var el=e.target.closest("[data-navtab],[data-sub],[data-back],[data-find],[data-goto],[data-flowgoal],[data-flowstart],[data-flowmode],[data-act],[data-act2],[data-plat],[data-mode],[data-tab],[data-aiact]"); if(!el)return;
    // pindah keluar dari Simulasi = matikan heatmap di canvas
    if(heatOn && el.dataset.navtab && el.dataset.navtab!=="simulasi"){ post({type:"clearHeatmap"}); heatOn=false; heatTop=[]; }
    if(el.dataset.navtab){
      state.nav=el.dataset.navtab; state.selId=null;
      if(state.nav==="layar") state.view="scan";
      if(state.nav==="alur"){ flowData=null; render(); post({type:"getFlow", startId:flowStartId}); return; }
      render(); return;
    }
    else if(el.dataset.sub){ state.view=el.dataset.sub; state.selId=null;
      if(el.dataset.sub==="headings"){ headings=[]; post({type:"getHeadings"}); }
      if(el.dataset.sub==="focus"){ focusItems=[]; post({type:"getFocus"}); }
      render(); }
    else if(el.dataset.back){ state.view="scan"; state.selId=null; render(); }
    else if(el.dataset.tab){ state.tab=el.dataset.tab; state.selId=null; render(); }
    else if(el.dataset.flowmode){ var fim=document.getElementById("featIntent"); if(fim) flowIntent=fim.value; var fpm=document.getElementById("featProduct"); if(fpm) flowProduct=fpm.value; flowMode=el.dataset.flowmode; render(); }
    else if(el.dataset.find){ state.selId=state.selId===el.dataset.find?null:el.dataset.find; render(); }
    else if(el.dataset.goto){ post({type:"select",id:el.dataset.goto}); }
    else if(el.dataset.flowgoal){ var fi=document.getElementById("flowIntent"); if(fi) flowIntent=fi.value; flowGoalId=(flowGoalId===el.dataset.flowgoal?null:el.dataset.flowgoal);
      // Ganti tujuan = journey lain. Vonis, override, dan insight dari tujuan lama tidak boleh ikut
      // ter-submit atas nama tujuan baru. Run yang sedang berjalan juga dibuang begitu datang.
      walkResult=null; journeyOverride=null; flowFindings=null; pendingWalkSig=null; pendingFlowSig=null; skWalkLoading=false; skFlowLoading=false; personaResult=null;
      render(); }
    else if(el.dataset.flowstart){ var fis=document.getElementById("flowIntent"); if(fis) flowIntent=fis.value; flowStartId=(flowStartId===el.dataset.flowstart?null:el.dataset.flowstart); flowGoalId=null; walkResult=null; journeyOverride=null; flowFindings=null; flowData=null; pendingWalkSig=null; pendingFlowSig=null; skWalkLoading=false; skFlowLoading=false; personaResult=null; render(); post({type:"getFlow", startId:flowStartId}); }
    else if(el.dataset.act){ fstate[el.dataset.id]=el.dataset.act; state.selId=null; render(); }
    else if(el.dataset.aiact){ aiState[+el.dataset.i]=el.dataset.aiact; render(); }
    else if(el.dataset.act2==="mint"){
      var jv2 = (flowData && flowData.wired) ? journeyVerdict() : null;
      var snap = {
        screen: { name:lastFrame, acc:accScore(), usa:usaScore(), open:openCount() },
        journey: jv2 ? { name:(flowData.startName||""), intent:flowIntent, taskDepth:flowData.maxDepth, status:jv2.status, reason:jv2.reason, walkthrough:(walkResult?walkResult.counts:null) } : null
      };
      post({type:"mint", open:openCount(), snapshot:snap});
      var r=document.getElementById("record");
      document.getElementById("recordBody").textContent = "Aksesibilitas "+accScore()+" · "+openCount()+" hal terbuka"+(snap.journey?(" · journey "+snap.journey.status):"");
      r.classList.add("show");
    }
    else if(el.dataset.act2==="editKey"){ keyEdit=true; skRaw=""; skDetail=""; skOk=""; render(); }
    else if(el.dataset.act2==="cancelKey"){ keyEdit=false; skRaw=""; skDetail=""; skOk=""; render(); }
    else if(el.dataset.act2==="needWs"){ wsNeeded=true; render(); }
    else if(el.dataset.act2==="testKoneksi"){ testKoneksi(); }
    else if(el.dataset.act2==="saveKey"){
      var inp=document.getElementById("keyInput"), wi=document.getElementById("wsInput");
      var w = wi ? bersihKunci(wi.value||"") : wsId;
      // Workspace ID punya bentuk pasti. Menerima teks bebas berarti header rusak
      // dikirim ke server, dan penolakannya jadi menuduh tokennya yang salah.
      if(w && !wsWajar(w)){
        skRaw="⚠ Workspace ID harus diawali wrkspc_ . Yang tertulis: \""+w+"\". Ambil dari URL Console bagian /settings/workspaces/wrkspc_… , atau kosongkan saja kalau tokenmu tidak terikat workspace.";
        skDetail=""; render(); return;
      }
      var k=bersihKunci((inp&&inp.value)||"");
      if(!k && !apiKey){ skRaw="⚠ Kolom token masih kosong."; skDetail=""; render(); return; }
      if(k && !kunciWajar(k)){
        skRaw="⚠ Bentuk token tidak wajar. Token Anthropic diawali sk-ant- dan panjangnya sekitar 100 karakter. Yang tertempel: "+k.slice(0,12)+"\u2026 ("+k.length+" karakter). Salin ulang seluruhnya dari console.anthropic.com.";
        skDetail=""; render(); return;
      }
      if(w!==wsId){ wsId=w; post({type:"saveWs",ws:wsId}); }
      if(k) apiKey=k;
      keyEdit=false; skRaw=""; skDetail="";
      skOk = (k?"Token tersimpan":"Workspace tersimpan") + (wsId?" · ws "+wsId.slice(0,14)+"\u2026":"") + ". Klik Analisa mendalam untuk mencoba.";
      if(k) post({type:"saveKey",key:apiKey});
      render(); }
    else if(el.dataset.act2==="analyzeGo"){ state.view="ai"; render(); }
    else if(el.dataset.act2==="flowAksa" || el.dataset.act2==="flowAksaFresh"){
      if(skFlowLoading) return;   // klik ganda dulu menembakkan dua analisa sekaligus
      var flowFresh=(el.dataset.act2==="flowAksaFresh");
      var fi2=document.getElementById("flowIntent"); if(fi2) flowIntent=fi2.value;
      var steps=flowData?flowData.steps.slice():[];
      if(flowGoalId){ var g=steps.filter(function(s){return s.id===flowGoalId;})[0]; if(g) steps=steps.filter(function(s){return s.depth<=g.depth;}); }
      flowTrimmed=Math.max(0, steps.length-FLOW_CAP);
      steps=steps.slice(0,FLOW_CAP);
      if(flowGoalId && steps.map(function(s){return s.id;}).indexOf(flowGoalId)<0){
        var gsx=(flowData.steps||[]).filter(function(s){return s.id===flowGoalId;})[0]; if(gsx) steps[steps.length-1]=gsx;
      }
      var fsig=flowSig(steps);
      if(!flowFresh && flowCache[fsig]){ flowFindings=flowCache[fsig]; skFlowLoading=false; render(); }
      else { pendingFlowSig=fsig; flowShotMode="journey"; flowFindings=null; skFlowLoading=true; render();
        // Balasan untuk journey yang sudah diganti dibuang di pintu, sebelum menyentuh state apa pun.
        requestShots(steps.map(function(s){return s.id;}), 0.4, function(sh){ if(fsig===pendingFlowSig) runFlowAksa(sh); }); }
    }
    else if(el.dataset.act2==="taskWalk" || el.dataset.act2==="taskWalkFresh"){
      if(skWalkLoading) return;   // klik ganda dulu menembakkan 10 run
      var walkFresh=(el.dataset.act2==="taskWalkFresh");
      var fi3=document.getElementById("flowIntent"); if(fi3) flowIntent=fi3.value;
      var ids=walkScreenIds();
      var wsig=(flowStartId||"")+"|"+(flowGoalId||"")+"|"+((flowIntent||"").trim())+"|"+ids.join(",");
      if(!walkFresh && walkCache[wsig]){ walkResult=walkCache[wsig]; journeyOverride=null; skWalkLoading=false; render(); }
      else { pendingWalkSig=wsig; flowShotMode="walk"; walkResult=null; journeyOverride=null; skWalkLoading=true; render();
        requestShots(ids, 0.4, function(sh){ if(wsig===pendingWalkSig) runTaskWalk(sh); }); }
    }
    else if(el.dataset.act2==="pTog" || el.dataset.act2==="kTog"){
      if(personaRunning) return;
      var arr=(el.dataset.act2==="pTog")?personaSel:kendalaSel, kx=el.dataset.k, ix=arr.indexOf(kx);
      if(ix>=0) arr.splice(ix,1); else arr.push(kx);
      personaErr=""; render();
    }
    else if(el.dataset.act2==="pN"){ if(personaRunning) return; personaN=parseInt(el.dataset.k,10)||3; render(); }
    else if(el.dataset.act2==="pCell"){ personaOpen=(personaOpen===el.dataset.k)?null:el.dataset.k; render(); }
    else if(el.dataset.act2==="personaStop"){ personaCancel=true; render(); }
    else if(el.dataset.act2==="personaRun" || el.dataset.act2==="personaFresh"){
      if(personaRunning) return;
      var fi4=document.getElementById("flowIntent"); if(fi4) flowIntent=fi4.value;
      if(!(flowData && flowData.wired)){ personaErr="Belum ada journey ter-wire."; render(); return; }
      var combos=personaCombos();
      if(!combos.length){ personaErr="Pilih minimal satu persona dan satu kendala."; render(); return; }
      var psig=personaJourneySig(), pkey=psig+"|"+JSON.stringify(combos)+"|"+personaN;
      if(el.dataset.act2==="personaRun" && personaCache[pkey]){ personaResult=personaCache[pkey]; personaErr=""; render(); return; }
      personaErr=""; personaResult=null; personaCancel=false; personaOpen=null; personaRunning=true; personaProg={done:0,total:combos.length*personaN}; render();
      var nRun=personaN;
      // Skala 1,0: kendala yang membaca dari gambar butuh teks yang benar-benar terbaca.
      requestShots(personaScreenIds(), 1, function(shots){ runPersonaSim(shots, psig, combos, nRun); });
    }
    else if(el.dataset.act2==="ovUsable" || el.dataset.act2==="ovBroken"){
      var orr=document.getElementById("ovReason"); var reason=((orr&&orr.value)||"").trim();
      journeyOverride={ status:(el.dataset.act2==="ovUsable"?"usable":"broken"), reason:reason, ts:Date.now(), original:journeyVerdict(true).status };
      render();
    }
    else if(el.dataset.act2==="ovClear"){ journeyOverride=null; render(); }
    else if(el.dataset.act2==="submitFeature"){
      var fif=document.getElementById("featIntent"); if(fif) flowIntent=fif.value;
      var fpr=document.getElementById("featProduct"); if(fpr) flowProduct=fpr.value;
      if(!(flowData && flowData.wired)) return;                                              // gate struktural: wajib wired
      if(!flowProduct){ productErr=true; submitErr=false; walkErr=false; render(); return; } // wajib pilih produk
      if(!flowIntent.trim()){ submitErr=true; productErr=false; walkErr=false; render(); return; } // wajib dinamai
      // Wajib walkthrough yang SAH dan MASIH BERLAKU. Dulu cukup walkResult ada: hasil yang isinya error
      // API (semua run gagal teknis) pun lolos, lalu ter-mint sebagai GATE PASS. Hasil untuk intent
      // atau tujuan lain juga lolos.
      if(!walkFreshFor()){ walkErr=true; productErr=false; submitErr=false; render(); return; }
      productErr=false; submitErr=false; walkErr=false;
      var fids=(flowData.steps||[]).map(function(s){return s.id;});
      featSubmitLoading=true; featRecord=null; render();
      post({type:"scanFrames", ids:fids});
    }
    else if(el.dataset.act2==="heatToggle"){ if(heatOn){ post({type:"clearHeatmap"}); } else { post({type:"heatmap"}); } }
    else if(el.dataset.act2==="copyMeas"||el.dataset.act2==="copyMeasJson"){
      var isJson=el.dataset.act2==="copyMeasJson";
      var txt=isJson?JSON.stringify(measSpec,null,2):measMd;
      copyText(txt); measCopied=isJson?"json":"md"; render();
      setTimeout(function(){ measCopied=""; render(); },1800);
    }
    else if(el.dataset.act2==="analyze"){
      var cc=document.getElementById("ctxContent"), ci=document.getElementById("ctxIntent");
      if(cc) aiCtx.content=cc.value; if(ci) aiCtx.intent=ci.value;
      if(!aiCtx.content.trim() && !aiCtx.intent.trim()) guessContext(); else analyze(false);
    }
    else if(el.dataset.act2==="analyzeFresh"){
      var cf=document.getElementById("ctxContent"), cif=document.getElementById("ctxIntent");
      if(cf) aiCtx.content=cf.value; if(cif) aiCtx.intent=cif.value;
      analyze(true);
    }
    else if(el.dataset.plat){ var p=el.dataset.plat; state.platforms[p]=!state.platforms[p]; render(); }
    else if(el.dataset.mode){ state.mode=el.dataset.mode; render(); }
  });

  // hover → highlight di canvas. Di-throttle + DIMATIKAN saat scroll (biar gak nge-hang)
  var lastHover=null, hoverTimer=null, scrolling=false, scrollT=null;
  function clearHover(){ clearTimeout(hoverTimer); if(lastHover){ lastHover=null; post({type:"unhover"}); } }
  document.addEventListener("scroll", function(){
    scrolling=true; clearHover();
    clearTimeout(scrollT); scrollT=setTimeout(function(){ scrolling=false; }, 180);
  }, true);
  document.body.addEventListener("mouseover",function(e){
    if(scrolling) return;
    var el=e.target.closest("[data-node],[data-goto]"); var id=el?(el.dataset.node||el.dataset.goto):null;
    if(!id || id===lastHover) return;
    clearTimeout(hoverTimer);
    hoverTimer=setTimeout(function(){ if(scrolling) return; lastHover=id; post({type:"hover",id:id}); }, 110);
  });
  document.body.addEventListener("mouseout",function(e){
    var el=e.target.closest("[data-node],[data-goto]"); if(!el)return;
    var to=e.relatedTarget, stillIn=to&&to.closest&&to.closest("[data-find],[data-goto]");
    if(!stillIn) clearHover();
  });
  window.addEventListener("blur",clearHover);

  window.onmessage=function(e){
    var msg=e.data.pluginMessage; if(!msg)return;
    if(msg.type==="findings"){ findings=msg.items||[]; checkedCount=msg.checked||0; nodeMap=msg.nodes||[]; render(); }
    else if(msg.type==="scannerRules"){ scannerRules = msg.rules || ""; }
    else if(msg.type==="key"){ apiKey=bersihKunci(msg.key||"");
      // Nilai tersimpan juga divalidasi. Kalau dulu sempat terisi teks bebas,
      // dia akan terkirim sebagai header rusak setiap plugin dibuka, dan
      // penolakannya terlihat seperti tokennya yang bermasalah.
      var w=bersihKunci(msg.ws||"");
      if(w && !wsWajar(w)){ w=""; post({type:"saveWs",ws:""}); }
      wsId=w;
      if(state.nav==="layar") render(); }
    else if(msg.type==="headings"){ headings=msg.items||[]; if(state.nav==="layar" && state.view==="headings") render(); }
    else if(msg.type==="focus"){ focusItems=msg.items||[]; if(state.nav==="layar" && state.view==="focus") render(); }
    else if(msg.type==="heatmap"){ heatOn=!!msg.drawn; heatTop=msg.top||[]; if(state.nav==="simulasi") render(); }
    else if(msg.type==="flow"){ flowData=msg; if(state.nav==="alur") render(); }
    else if(msg.type==="flowShots"){
      // Dirutekan lewat reqId, bukan variabel global. Balasan yang pemintanya sudah dibatalkan dibuang.
      var hs = msg.reqId ? shotHandlers[msg.reqId] : null;
      if(msg.reqId){ delete shotHandlers[msg.reqId]; if(hs) hs(msg.shots||[]); }
      else if(flowShotMode==="walk") runTaskWalk(msg.shots||[]); else runFlowAksa(msg.shots||[]);
    }
    else if(msg.type==="featureScreens"){
      // Model final: per-screen = skor AKSESIBILITAS (deterministik). Usability = pengaya, tidak ikut gate.
      // Gate feature = journey tidak BROKEN DAN semua screen aksesibilitas >= floor.
      var FLOOR=80;
      var scr=(msg.screens||[]).map(function(s){ var acc=accFromFindings(s.findings); return { nodeId:s.id, name:s.name, acc:acc, findings:(s.findings||[]).length }; });
      var jv=journeyVerdict();
      var avg=scr.length?Math.round(scr.reduce(function(a,x){return a+x.acc;},0)/scr.length):0;
      var minAcc=scr.length?Math.min.apply(null,scr.map(function(x){return x.acc;})):0;
      var accPass=(minAcc>=FLOOR), journeyPass=(jv.status!=="BROKEN");
      var gate=(accPass && journeyPass)?"GATE PASS":"GATE BLOCKED";
      var snapshot={ product:flowProduct, feature:flowIntent, screens:scr,
        journey:{ intent:flowIntent, status:jv.status, basis:(jv.basis||null), confidence:(jv.confidence||null), agree:(jv.agree||null), gates:(!!jv.gate),
                  override:(journeyOverride||null), reason:jv.reason, taskDepth:(flowData?flowData.maxDepth:0), walkthrough:(walkResult?walkResult.counts:null) },
        avgAcc:avg, minAcc:minAcc, floor:FLOOR, gate:gate,
        gateReason:{ accessibility:(accPass?"pass":"below-floor"), journey:(journeyPass?"pass":"broken") },
        // Asal-usul vonis. Tanpa ini snapshot tidak bisa ditelusuri, padahal beda model bisa
        // mengubah hasil sangat jauh, dan aturan kalibrasi bisa berubah antar versi.
        provenance:{
          model_walkthrough: MODEL,
          model_judge: (judgeBlocked ? MODEL : MODEL_JUDGE),
          judge_blocked: !!judgeBlocked,
          knowledge_versi: KNOWLEDGE.versi,
          aturan_total: KNOWLEDGE.kalibrasi.length,
          waktu: new Date().toISOString()
        },
        // Catatan mutu bukti ikut dibawa. Kalau tidak, pembaca hilir melihat PASS tanpa tahu
        // vonisnya sempat berubah, atau task-nya bocor jadi label di layar.
        evidence: (walkResult ? {
          vonis_goyah: !!(walkResult.goyah),
          vonis_sebelumnya: (walkResult.goyah ? walkResult.goyah.dulu : null),
          kebocoran_task: (walkResult.leak ? walkResult.leak.level : null),
          layar_padat: (walkResult.padat || []).map(function(x){ return { layar:x.layar, teks:x.terlihat, tap:x.tap, berat:!!x.berat }; }),
          task_komparatif: (walkResult.banding || null)
        } : null) };
      // Measurement Handoff: spec instrumentasi ikut masuk snapshot → dibaca dev/QA lewat Web Govern
      var meas=buildMeasurement(scr); snapshot.measurement=meas;
      // Simulasi persona: ADVISORY, tidak menyentuh gate. Disimpan sebagai prediksi per profil yang
      // nanti dijoin dengan properti sesi runtime (a11y_font_scale, a11y_screen_reader, dst).
      if(personaResult && personaResult.sig===personaJourneySig() && !personaResult.dibatalkan){
        var PR=personaResult;
        snapshot.persona_sim = { advisory:true, nge_gate:false, model:PR.model, knowledge:PR.knowledge, waktu:PR.waktu,
          run_per_kombinasi:PR.N, lengkap:PR.ringkas.lengkap, tujuan_terverifikasi:!!PR.goal,
          kombinasi:PR.ringkas.kombinasi.map(function(c){ return { persona:c.persona, kendala:c.kendala, profil:c.profil, n:c.n,
            sampai:c.sampai, berhasil:c.v.berhasil, rapuh:c.v.rapuh, gagal:c.v.gagal, nyasar:c.v.nyasar,
            rasio_mundur:c.rasio_mundur, titik_gagal:c.titik_gagal }; }) };
        var rp={}; personaRisiko(PR).forEach(function(c){ if(c.profil) rp[c.profil]=1; });
        meas.persona_profil_berisiko = Object.keys(rp);
      }
      measSpec=meas; measMd=measurementMd(meas);
      featRecord={ product:flowProduct, feature:flowIntent, screens:scr, avgAcc:avg, journey:{status:jv.status}, gate:gate };
      featSubmitLoading=false;
      post({type:"mint", targetId:(flowData?flowData.startId:null), open:0, snapshot:snapshot});
      if(state.nav==="alur") render();
    }
    else if(msg.type==="preview"){
      if(previewUrl){URL.revokeObjectURL(previewUrl);previewUrl=null;} previewB64=null;
      // Frame berganti: temuan AI, rubrik, dan konteks milik frame lama tidak boleh ikut memotong
      // skor segmen dan skor usability frame baru.
      if(msg.name && msg.name!==lastFrame && lastFrame){ aiFindings=[]; aiRubric=null; aiState={}; aiCtx={content:"",intent:""}; ctxGuessed=false; skPinned=false; }
      if(msg.bytes){ var u8=new Uint8Array(msg.bytes); previewUrl=URL.createObjectURL(new Blob([u8],{type:"image/png"})); previewB64=toB64(u8); }
      if(msg.name) lastFrame=msg.name;
      if(state.nav==="simulasi") renderPreview();
    }
  };

  renderFoot(); render();
