<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<style>
  :root{
    /* =========================================================
       TIS v4. Nama variabel dipertahankan dari v1 dan v2 supaya
       seluruh var(--x) yang sudah ada ikut berubah tanpa disentuh.
       Nilai permukaan dibuat TETAP, bukan alpha, supaya kontras
       bisa dihitung dengan pasti. Itu pelajaran dari glow ungu.
       ========================================================= */

    /* --- permukaan, tiga lapis saja --- */
    --bg:#000918;            /* L0 kanvas */
    --l0-top:#000C1F;        /* L0 atas, untuk gradient */
    --surface:#0F1826;       /* L1 kartu, setara putih 6% */
    --card:#0F1826;
    --l2:#1A222F;            /* L2 kartu dibuka, setara putih 10% */
    --dark:#0F1826;
    --dark2:#1A222F;
    --glass:#0F1826;
    --glass-brd:rgba(255,255,255,.10);
    --line:rgba(255,255,255,.10);
    --line2:rgba(255,255,255,.16);

    /* --- state terpilih, satu-satunya permukaan terang --- */
    --inv:#FFFFFF;
    --on-inv:#0B1020;        /* 18,9:1 */

    /* --- teks, tiga tingkat --- */
    --ink:#FFFFFF;           /* 17,8:1 di L1 */
    --mut:#C3C8D4;           /* 10,6:1 */
    --mut2:#9AA0AE;          /*  6,8:1 */

    /* --- status, dihitung ulang untuk latar gelap --- */
    --red:#F2586E;           /* 5,43:1 di L1 · 4,89:1 di L2 */
    --amber:#E8B600;         /* 9,45 · 8,50 */
    --green:#2BA875;         /* 5,91 · 5,32 */
    --blu:#6E95BE;           /* 5,70 · 5,13 */
    --violet:#9B85CB;        /* 5,62 · 5,05 */
    --coral:#F2586E;

    /* --- tint latar kotak peringatan, 16% di atas L1 --- */
    --red-soft:#342231;
    --amber-soft:#323120;
    --green-soft:#142F33;
    --blu-soft:#1E2C3E;
    --violet-soft:#252334;
    --tis-soft:rgba(230,0,18,.14);

    /* --- sorot, dipinjam dari GO Club --- */
    --hi:#FFD84D;            /* 12,9:1 di L1 */
    --on-hi-1:#1A1400;       /* 13,3:1 di atas --hi */
    --on-hi-2:#3D3000;       /*  9,4:1 */

    /* --- merek, HANYA logo dan tombol utama, tidak pernah status --- */
    --tis:#E60012;

    /* --- bentuk --- */
    --r-lg:22px; --r-md:16px; --r-sm:10px; --pill:999px;
    --sp1:4px; --sp2:8px; --sp3:12px; --sp4:16px; --sp5:20px; --sp6:24px;

    --sans:"Inter",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,monospace;
  }
  *{box-sizing:border-box}
  html{background:#000C1F}
  body{margin:0;font-family:var(--sans);color:var(--ink);font-size:12px;
    -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;height:100vh;
    /* v4: gradient datar. Glow ungu dibuang karena dia dekorasi yang menaikkan
       kompleksitas latar tanpa menambah informasi, dan bikin kontras tidak bisa dihitung. */
    background:linear-gradient(180deg,var(--l0-top),var(--bg));
    background-attachment:fixed}
  button{font-family:inherit;cursor:pointer;color:inherit}
  svg{display:block}
  b{font-weight:700}

  /* ── top bar (frosted) ───────────────────── */
  .top{display:flex;align-items:center;gap:10px;padding:13px 16px;flex:0 0 auto;min-height:50px;
    background:rgba(0,9,24,.55);backdrop-filter:blur(28px) saturate(1.8);-webkit-backdrop-filter:blur(28px) saturate(1.8);
    border-bottom:1px solid rgba(255,255,255,.10)}
  .badge{width:26px;height:26px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
    filter:drop-shadow(0 2px 5px rgba(230,0,18,.35))}
  .badge svg{width:100%;height:100%;display:block}
  .top .nm{font-weight:700;font-size:12.5px;letter-spacing:-.01em}
  .top .nm small{display:block;color:var(--mut2);font-weight:500;font-size:9.5px;margin-top:1px;letter-spacing:.02em}
  .back{border:0;background:none;color:#0A84FF;font-size:12.5px;display:flex;align-items:center;gap:4px;font-weight:600;padding:4px 8px;margin-left:-8px;border-radius:8px}
  .back:hover{background:rgba(10,132,255,.1)}
  .top .vt{font-weight:700;font-size:13px;letter-spacing:-.01em}
  .std{margin-left:auto;font-size:9px;font-weight:700;letter-spacing:.04em;color:var(--mut);border:1px solid var(--glass-brd);border-radius:20px;padding:4px 10px;
    background:rgba(255,255,255,.08);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}

  .scroll{flex:1;overflow:auto} .pad{padding:14px 16px}

  /* ── hero ────────────────────────────────── */
  .hero{margin:14px 16px 0}
  .hero button{width:100%;border:1px solid rgba(255,255,255,.35);border-radius:16px;color:#fff;padding:15px 16px;font-weight:800;font-size:13.5px;letter-spacing:-.01em;
    display:flex;align-items:center;justify-content:center;gap:8px;
    background:linear-gradient(180deg,rgba(255,66,79,.92),rgba(216,0,15,.92));
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    box-shadow:0 10px 26px -8px rgba(230,0,18,.5), inset 0 1px 0 rgba(255,255,255,.4)}
  .hero button:hover{filter:brightness(1.06)}
  .hero .c{font-size:14px}

  /* ── AKSA card (dark glass) ──────────────── */
  .sidekick{margin:12px 16px 0;border-radius:18px;background:var(--dark);color:#E8E8EC;padding:14px 15px;
    backdrop-filter:blur(30px) saturate(1.6);-webkit-backdrop-filter:blur(30px) saturate(1.6);
    border:1px solid rgba(255,255,255,.14);box-shadow:0 14px 34px -14px rgba(255,255,255,.55), inset 0 1px 0 rgba(255,255,255,.12)}
  .sk-h{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:800;color:#FFC2A8;letter-spacing:.14em;text-transform:uppercase}
  .sk-h .dot{width:6px;height:6px;border-radius:50%;background:#FFC2A8;box-shadow:0 0 10px rgba(240,169,142,.9)}
  .sk-tag{font-size:9.5px;color:rgba(255,255,255,.60);margin-top:3px;font-weight:500;letter-spacing:.03em}
  .sk-body{font-size:11.5px;color:rgba(242,239,234,.78);line-height:1.55;margin-top:9px}
  .sk-body b{color:#fff;font-weight:700}
  .sk-ai{margin-top:11px;border-top:1px solid rgba(255,255,255,.12);padding-top:11px}
  .sk-key{display:flex;gap:6px}
  .sk-key input{flex:1;min-width:0;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:10px;color:#E8E8EC;font-size:10.5px;padding:9px 10px;font-family:var(--mono)}
  .sk-key input::placeholder{color:rgba(255,255,255,.52)}
  .sk-key input:focus{outline:none;border-color:#FFC2A8}
  .sk-btn{border:1px solid rgba(255,255,255,.25);background:rgba(240,169,142,.92);color:#211E1A;border-radius:10px;padding:9px 13px;font-size:11px;font-weight:800;white-space:nowrap;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.52)}
  .sk-btn.full{width:100%;padding:11px}
  .sk-btn:hover{background:#FFD3BE}
  .sk-foot{font-size:9px;color:rgba(255,255,255,.58);margin-top:8px}
  .sk-last{margin-top:9px;font-size:10.5px;font-weight:700;color:#FFC2A8}
  .thinking{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;padding:14px;border-radius:14px;background:var(--dark);
    backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.14);font-weight:700;font-size:12px;color:#FFC2A8}
  .sp{width:13px;height:13px;border:2px solid rgba(240,169,142,.25);border-top-color:#FFC2A8;border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .sk-fallback{font-size:11px;color:var(--mut);line-height:1.55;margin-top:10px;white-space:pre-wrap;border-left:2px solid var(--coral);padding-left:10px}
  .ctx{margin-bottom:12px;border:1px solid var(--glass-brd);border-radius:14px;padding:11px 12px;background:var(--glass);backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6)}
  .ctx-h{font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin-bottom:9px}
  .ctx-h span{font-weight:500;text-transform:none;letter-spacing:0;color:var(--mut2)}
  .ctx-guess{font-weight:700;text-transform:none;letter-spacing:0;color:#FFC2A8;background:var(--coral-soft);border-radius:20px;padding:2px 8px}
  .ctx-hint{margin-top:9px;font-size:10.5px;color:#FFC2A8;background:var(--coral-soft);border-radius:10px;padding:9px 11px;line-height:1.45}
  .synk{font-size:9.5px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;color:var(--mut2)}
  .ctx-hint b{color:var(--ink)}
  .ctx-in{display:block;width:100%;border:1px solid var(--line2);border-radius:10px;background:rgba(255,255,255,.12);color:var(--ink);font-size:11px;padding:9px 11px;font-family:var(--sans);margin-bottom:7px;line-height:1.45;resize:vertical;min-height:52px}
  .ctx-in:last-child{margin-bottom:0}
  .ctx-in::placeholder{color:var(--mut2)}
  .ctx-in:focus{outline:none;border-color:var(--coral)}

  /* ── home menu (frosted table view) ──────── */
  .grp{font-size:9.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mut2);padding:18px 20px 7px}
  .list{margin:0 16px;border:1px solid var(--glass-brd);border-radius:16px;overflow:hidden;
    background:var(--glass);backdrop-filter:blur(24px) saturate(1.7);-webkit-backdrop-filter:blur(24px) saturate(1.7);
    box-shadow:0 8px 22px -12px rgba(30,30,50,.18), inset 0 1px 0 rgba(255,255,255,.6)}
  .row{display:flex;align-items:center;gap:11px;width:100%;padding:12px 13px;border:0;background:none;text-align:left}
  .row + .row{border-top:1px solid rgba(60,60,67,.1)}
  .row:hover{background:rgba(255,255,255,.08)}
  .row .ic{width:28px;height:28px;flex:0 0 28px;border-radius:8px;background:linear-gradient(180deg,#FF5A64,#E60012);color:#fff;display:flex;align-items:center;justify-content:center;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
  .row.moat .ic{background:linear-gradient(180deg,#FFB79A,#B85C3C)}
  .row .lab{flex:1;font-size:12.5px;font-weight:600;letter-spacing:-.01em}
  .row .cnt{min-width:21px;height:21px;padding:0 6px;border-radius:20px;background:var(--tis);color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center}
  .row .cnt.zero{background:rgba(120,120,128,.14);color:var(--mut2)}
  .row .soon{font-size:8.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--mut2);border:1px solid var(--line2);border-radius:20px;padding:3px 7px}
  .row .chev{color:rgba(255,255,255,.52);font-size:14px}
  .row:hover .chev{color:var(--mut)}

  /* ── scan dashboard ──────────────────────── */
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:14px 16px 4px}
  .stat{border:1px solid var(--glass-brd);border-radius:16px;padding:12px 13px;position:relative;min-height:74px;
    background:var(--glass);backdrop-filter:blur(22px) saturate(1.7);-webkit-backdrop-filter:blur(22px) saturate(1.7);
    box-shadow:0 8px 20px -12px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.6)}
  .stat .lbl{font-size:10px;color:var(--mut);font-weight:700;letter-spacing:.05em;text-transform:uppercase}
  .stat .num{font-size:28px;font-weight:800;letter-spacing:-.03em;margin-top:6px;line-height:1}
  .stat .num small{font-size:14px;font-weight:700;color:var(--mut2);margin-left:1px}
  .stat .si{position:absolute;top:11px;right:11px;width:19px;height:19px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:800;box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
  .si.red{background:var(--red)} .si.amber{background:var(--amber)} .si.green{background:var(--green)}
  .gauge{position:absolute;top:10px;right:10px}

  /* iOS segmented control */
  .tabs{display:flex;gap:2px;margin:12px 16px 6px;background:rgba(255,255,255,.06);border-radius:11px;padding:2px;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .tab{flex:1;border:0;background:none;border-radius:9px;padding:8px 4px;font-size:10.5px;font-weight:700;color:var(--mut)}
  .tab.on{background:rgba(255,255,255,.14);color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.12), inset 0 1px 0 rgba(255,255,255,.8)}

  /* kesiapan per segmen */
  .segwrap{margin:6px 16px 0;border:1px solid var(--glass-brd);border-radius:16px;padding:12px 13px 6px;
    background:var(--glass);backdrop-filter:blur(22px) saturate(1.7);-webkit-backdrop-filter:blur(22px) saturate(1.7);
    box-shadow:0 8px 20px -12px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.6)}
  .seg{display:flex;align-items:center;gap:8px;margin-bottom:11px;flex-wrap:wrap}
  .seg-emo{font-size:13px;flex:0 0 auto;width:18px;text-align:center}
  .seg-lbl{font-size:11.5px;font-weight:600;color:var(--ink);flex:1}
  .seg-pct{font-size:11.5px;font-weight:800;flex:0 0 auto;min-width:34px;text-align:right;font-variant-numeric:tabular-nums}
  .seg-pct.red{color:var(--red)} .seg-pct.amber{color:var(--amber)} .seg-pct.green{color:var(--green)}
  .seg-bar{flex:1 1 100%;height:5px;border-radius:6px;background:rgba(255,255,255,.14);overflow:hidden;margin-left:26px}
  .seg-bar i{display:block;height:100%;border-radius:6px;transition:width .3s ease}
  .seg-bar i.red{background:var(--red)} .seg-bar i.amber{background:var(--amber)} .seg-bar i.green{background:var(--green)}

  /* chip siapa-kena */
  .who{margin-top:6px;display:flex;gap:4px;flex-wrap:wrap;align-items:center}
  .who .lbl{font-size:9px;color:var(--mut2);font-weight:600}
  .gchip{font-size:9px;font-weight:700;background:rgba(0,9,24,.55);border:1px solid rgba(255,255,255,.10);border-radius:20px;padding:2px 7px}

  /* ── finding cards ───────────────────────── */
  .fh{font-size:9.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mut2);padding:14px 20px 7px}
  .find{margin:0 16px 8px;border:1px solid var(--glass-brd);border-radius:15px;overflow:hidden;
    background:var(--glass);backdrop-filter:blur(22px) saturate(1.7);-webkit-backdrop-filter:blur(22px) saturate(1.7);
    box-shadow:0 6px 18px -12px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.55)}
  .find-hd{display:flex;gap:10px;align-items:flex-start;padding:12px;cursor:pointer}
  .find-hd:hover{background:rgba(255,255,255,.08)}
  .sic{width:20px;height:20px;border-radius:50%;flex:0 0 20px;margin-top:1px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:800;box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
  .sic.red{background:var(--red)} .sic.amber{background:var(--amber)} .sic.ai{background:#26262B;color:#FFC2A8;font-size:8px;letter-spacing:.02em}
  .hlvl{flex:0 0 auto;min-width:28px;height:20px;padding:0 6px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;margin-top:1px}
  .hlvl.h1{background:var(--tis-soft);color:#FF99A8} .hlvl.h2{background:var(--coral-soft);color:#FFC2A8} .hlvl.htx{background:rgba(120,120,128,.14);color:var(--mut)}
  .find .body{flex:1;min-width:0}
  .find .ttl{font-size:12.5px;font-weight:600;color:var(--ink);letter-spacing:-.01em;line-height:1.35}
  .find .layer{font-size:9.5px;color:var(--mut2);font-family:var(--mono);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .find .imp{font-size:10px;color:var(--amber);margin-top:4px;font-weight:700}
  .find .ainote{font-size:11px;color:var(--mut);margin-top:6px;line-height:1.5}
  .find .aisaran{font-size:11px;color:#7BE8B0;margin-top:8px;line-height:1.5;background:var(--green-soft);border:1px solid rgba(47,133,82,.25);border-radius:9px;padding:8px 10px}
  .find .aisaran b{color:#7BE8B0}
  .find .kat{display:inline-block;font-size:8.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:#FFC2A8;background:var(--coral-soft);border-radius:5px;padding:2px 6px;margin-top:6px}
  .find .chev{color:rgba(255,255,255,.52);align-self:center;font-size:13px}

  /* ── detail: authority split ─────────────── */
  .detail{border-top:1px solid rgba(60,60,67,.1);padding:12px;background:rgba(255,255,255,.08)}
  .goto{font-size:10.5px;color:#0A84FF;background:none;border:0;padding:0;margin-bottom:4px;font-weight:700}
  .goto:hover{text-decoration:underline}
  .src-group{margin-top:10px;border-left:2px solid var(--line);padding-left:10px}
  .src-group.vonis{border-left-color:var(--tis)}
  .src-group.tanya{border-left-color:var(--coral)}
  .src-group.manusia{border-left-color:var(--violet)}
  .src-gh{font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:6px}
  .src-group.vonis .src-gh{color:#FF99A8}
  .src-group.tanya .src-gh{color:#FFC2A8}
  .src-group.manusia .src-gh{color:#D6CDFF}
  .gdot{width:6px;height:6px;border-radius:50%;flex:0 0 6px}
  .gdot.vonis{background:var(--tis)} .gdot.tanya{background:var(--coral)} .gdot.manusia{background:var(--violet)}
  .sitem{display:flex;gap:8px;align-items:flex-start;margin-bottom:9px}
  .sdot{width:8px;height:8px;border-radius:2.5px;margin-top:4px;flex:0 0 8px}
  .sdot.wcag{background:var(--tis)} .sdot.ds{background:#C9C9D2} .sdot.apple{background:#1C1C1E}
  .sdot.android{background:#3DDC84} .sdot.uxlaw{background:var(--coral)} .sdot.uxpsych{background:var(--violet)}
  .sbody{flex:1;min-width:0}
  .sname{font-size:10.5px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .stier{font-weight:500;color:var(--mut2);font-size:9px}
  .verdict{font-size:8.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding:2px 6px;border-radius:5px}
  .verdict.fail{background:var(--tis-soft);color:#FF99A8} .verdict.thin{background:var(--amber-soft);color:#FFC800}
  .verdict.review,.verdict.q{background:var(--coral-soft);color:#FFC2A8} .verdict.psych{background:var(--violet-soft);color:#D6CDFF}
  .scode{font-family:var(--mono);font-size:9.5px;color:var(--mut2);margin-top:3px}
  .snote{font-size:10.5px;color:var(--mut);margin-top:3px;line-height:1.45} .snote b{color:var(--ink)}
  .suggest{display:flex;gap:10px;align-items:flex-start;margin-top:12px;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.10);border-radius:12px;padding:10px;font-size:10.5px;color:var(--mut);line-height:1.45}
  .suggest .sw{width:24px;height:24px;border-radius:7px;flex:0 0 24px;border:1px solid rgba(28,28,30,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
  .suggest b{color:var(--ink)} .suggest .mono{font-family:var(--mono);color:var(--tis);font-weight:600}
  .sg-note{color:var(--mut2);font-size:9.5px;margin-top:3px;line-height:1.4}
  .impact{margin-top:11px;display:flex;gap:9px;align-items:flex-start}
  .im-txt{font-size:10px;color:var(--mut);line-height:1.45} .im-txt b{color:var(--ink)} .im-txt i{color:var(--mut2);font-style:normal}
  .acts{display:flex;gap:6px;margin-top:12px}
  .act{flex:1;border:1px solid rgba(60,60,67,.18);background:rgba(255,255,255,.10);color:var(--mut);padding:8px 4px;border-radius:10px;font-size:10.5px;font-weight:700;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  .act:hover{border-color:var(--ink);color:var(--ink)}
  .act:first-child{border-color:rgba(47,133,82,.5);color:var(--green)}
  .act:first-child:hover{background:var(--green-soft)}
  .empty{padding:44px 24px;text-align:center;color:var(--mut2);font-size:12px;line-height:1.6}
  .empty .ok{font-size:28px;color:var(--green);margin-bottom:8px}

  /* ── modes ───────────────────────────────── */
  .chips{display:flex;gap:6px;margin-bottom:14px}
  .chip{border:1px solid rgba(60,60,67,.18);background:rgba(0,9,24,.55);color:var(--mut);border-radius:20px;padding:5px 13px;font-size:11px;font-weight:700;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .modes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .mode{border:1px solid rgba(60,60,67,.16);background:rgba(255,255,255,.08);color:var(--mut);border-radius:10px;padding:9px 4px;font-size:10px;font-weight:700;text-align:center;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .mode:hover{border-color:var(--mut2)}
  .preview{margin-top:14px;border:1px solid var(--glass-brd);border-radius:16px;overflow:hidden;display:flex;align-items:center;justify-content:center;min-height:280px;
    background:rgba(255,255,255,.10);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    box-shadow:0 8px 22px -12px rgba(30,30,50,.18), inset 0 1px 0 rgba(255,255,255,.55)}
  .preview .ph{padding:40px 12px;text-align:center;color:var(--mut2);font-size:12px}
  .preview img{display:block;width:100%;height:auto;max-height:68vh;object-fit:contain}
  .mode-note{font-size:11px;color:var(--mut);margin-top:10px;line-height:1.55}
  .coming{padding:40px 24px;text-align:center;color:var(--mut2);font-size:12px;line-height:1.65}
  .coming .big{font-size:24px;margin-bottom:10px}

  /* ── bottom tab nav (frosted) ────────────── */
  .nav{display:flex;gap:3px;padding:6px 10px;flex:0 0 auto;border-top:1px solid rgba(255,255,255,.10);
    background:rgba(0,9,24,.55);backdrop-filter:blur(28px) saturate(1.8);-webkit-backdrop-filter:blur(28px) saturate(1.8)}
  .nav button{flex:1;border:0;background:none;border-radius:11px;padding:6px 4px 5px;display:flex;flex-direction:column;align-items:center;gap:3px;
    color:var(--mut2);font-weight:700;font-size:10px;letter-spacing:-.01em}
  .nav button .ni{width:22px;height:22px;display:flex;align-items:center;justify-content:center}
  .nav button.on{color:var(--ink);background:rgba(255,255,255,.10);box-shadow:none}
  .nav button.on .ni svg{stroke:var(--tis)}

  /* ── disclosure "Atur" ───────────────────── */
  details.atur{margin:0 0 12px;border:1px solid var(--glass-brd);border-radius:14px;overflow:hidden;background:var(--glass);
    backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6)}
  details.atur summary{cursor:pointer;padding:11px 13px;font-weight:700;font-size:12px;list-style:none;display:flex;align-items:center;gap:7px}
  details.atur summary::-webkit-details-marker{display:none}
  details.atur summary .cx{margin-left:auto;color:var(--mut2);transition:transform .2s}
  details.atur[open] summary .cx{transform:rotate(90deg)}
  details.atur[open] summary{border-bottom:1px solid rgba(60,60,67,.1)}
  .atur-b{padding:12px 13px}

  /* ── footer / gate (frosted) ─────────────── */
  footer{border-top:1px solid rgba(255,255,255,.10);padding:12px 16px;flex:0 0 auto;
    background:rgba(0,9,24,.55);backdrop-filter:blur(28px) saturate(1.8);-webkit-backdrop-filter:blur(28px) saturate(1.8)}
  .mint{width:100%;border:1px solid rgba(255,255,255,.25);border-radius:14px;padding:13px;font-weight:800;font-size:12.5px;letter-spacing:-.01em;color:#fff;
    background:linear-gradient(180deg,rgba(48,48,54,.95),rgba(24,24,28,.95));
    box-shadow:0 8px 20px -8px rgba(255,255,255,.5), inset 0 1px 0 rgba(255,255,255,.18)}
  .mint:hover{filter:brightness(1.15)} .mint .q{font-size:10.5px;opacity:.6;font-weight:600}
  .record{display:none;margin-top:10px;border:1px solid rgba(47,133,82,.3);background:rgba(47,133,82,.12);border-radius:12px;padding:10px 12px;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .record.show{display:block}
  .record .rt{font-size:11px;font-weight:800;color:#7BE8B0} .record .rb{font-size:10px;color:#9FD9BC;margin-top:4px;line-height:1.4}
  .thread{display:flex;align-items:center;gap:6px;margin-top:9px;font-size:9.5px;color:var(--mut)}
  .pill{background:rgba(255,255,255,.12);border:1px solid rgba(47,133,82,.25);border-radius:20px;padding:3px 9px;font-weight:700}

  ::-webkit-scrollbar{width:8px} ::-webkit-scrollbar-thumb{background:rgba(120,120,128,.35);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
  ::-webkit-scrollbar-thumb:hover{background:rgba(120,120,128,.55);background-clip:padding-box}

  /* v2: segmented Aksesibilitas / Usability */
  .segtop{display:flex;gap:4px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.10);
    border-radius:100px;padding:4px;margin:12px 16px 4px}
  .segtop button{flex:1;border:0;background:none;color:var(--mut);font-weight:700;font-size:12px;
    padding:8px 6px;border-radius:100px;cursor:pointer;font-family:var(--sans)}

  /* v2: skor besar bergaya redesign */
  .bigscore{position:relative;margin:12px 16px 6px;padding:20px 16px 16px;border-radius:22px;
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.10);text-align:center;overflow:hidden}
    .bigscore .n{position:relative;font-size:54px;font-weight:800;line-height:1;letter-spacing:-.03em;
    background:linear-gradient(180deg,#FFC800,#B58E00);-webkit-background-clip:text;background-clip:text;color:transparent}
  .bigscore .t{position:relative;font-size:13px;font-weight:700;margin-top:8px;color:var(--ink)}
  .bigscore .s{position:relative;font-size:11.5px;font-weight:500;margin-top:2px}
  .bigscore .u{position:relative;margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,.10);text-align:left}

  /* v2: semua kolom isian ikut tema gelap */
  input,textarea,select{background:rgba(255,255,255,.08)!important;color:var(--ink)!important;
    border:1px solid rgba(255,255,255,.14)!important;font-family:var(--sans)}
  input::placeholder,textarea::placeholder{color:var(--mut2)}
  ::selection{background:rgba(255,200,0,.28)}

  /* =====================================================================
     v2 REDESIGN — sistem spasi tunggal.
     Aturan: inset samping DIPEGANG SATU TEMPAT (#app), tiap blok cuma mengatur
     jarak bawahnya. Sebelumnya tiap komponen mengatur margin sampingnya sendiri,
     lalu satu aturan #app > * menghapusnya diam-diam. Itu sumber blok yang mepet.
     Ritme: inset 16, jarak antar blok 12, padding dalam kartu 16.
     ===================================================================== */
  :root{ --purple:#7055E7; --purple-100:#D6CDFF; --sp1:4px; --sp2:8px; --sp3:12px; --sp4:16px; --sp5:20px; --sp6:24px; }


  /* --- top bar: tanpa latar, duduk langsung di atas gradient --- */
  .top{background:transparent !important;backdrop-filter:none !important;
    -webkit-backdrop-filter:none !important;border-bottom:0 !important;
    padding:var(--sp5) var(--sp4) var(--sp3) !important;min-height:0 !important;
    gap:var(--sp3) !important;align-items:center}
  .top .badge{width:32px !important;height:32px !important;filter:none !important}
  .top .nm{font-size:12px !important;font-weight:600 !important;line-height:1.3;letter-spacing:0}
  .top .year{font-size:12px;font-weight:600;color:#FFFFFF;flex:0 0 auto;margin-left:auto}
  .top .back,.top .vt{font-size:14px;font-weight:700;color:#fff}

  /* --- INSET TUNGGAL. Semua anak #app tidak boleh punya margin samping. --- */
  #app{padding:0 var(--sp4) var(--sp4) !important}
  #app > *{margin-left:0 !important;margin-right:0 !important;margin-top:0 !important}
  #app > * + *{margin-top:var(--sp3) !important}
  .pad{padding:0 !important}
  .pad > * + *{margin-top:var(--sp3)}

  /* --- kartu: radius 22, putih 8%, padding 16 --- */
  .card,.find,.stat,.segwrap,.sidekick,.ctx,.rub,.bigscore,.atur{
    background:rgba(255,255,255,.08) !important;
    border:1px solid rgba(255,255,255,.10) !important;
    border-radius:22px !important;
    padding:var(--sp4) !important;
    margin:0 !important;
    backdrop-filter:blur(25px) !important;-webkit-backdrop-filter:blur(25px) !important;
    box-shadow:0 4px 15px rgba(0,0,0,.25) !important}
  .find + .find{margin-top:var(--sp3) !important}
  .find{cursor:pointer}
  .stat{padding:var(--sp3) !important}

  /* --- segmented control --- */
  .segtop{display:flex;height:48px;background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.10);border-radius:12px;padding:var(--sp1);gap:2px;
    backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px)}
  .segtop button{flex:1;border:0;border-radius:8px;font-size:14px;font-weight:400;
    color:#FFFFFF;background:none;cursor:pointer;font-family:var(--sans);padding:0}
  .segtop button.on{background:#FFFFFF;color:#1C1C1E;font-weight:700}

  /* --- skor besar --- */
  .bigscore{position:relative;overflow:hidden;text-align:left;padding:var(--sp4) var(--sp5) !important}
  .bigscore{--g1:#FFC800;--g2:#B58E00;--glowc:rgba(255,200,0,.30)}
    .bigscore .n{position:relative;font-size:60px;font-weight:800;line-height:1.05;letter-spacing:-.03em;
    background:linear-gradient(180deg,var(--g1),var(--g2));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .bigscore .t{position:relative;font-size:14px;font-weight:700;margin-top:var(--sp2);color:#fff}
  .bigscore .s{position:relative;font-size:12px;font-weight:500;margin-top:var(--sp1)}
  .bigscore .c{position:relative;display:inline-block;margin-top:var(--sp3);
    font-size:11px;font-weight:600;color:#9E9EA6;background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.10);border-radius:100px;padding:5px 12px}
  .bigscore .u{position:relative;margin-top:var(--sp4);padding-top:var(--sp3);
    border-top:1px solid rgba(255,255,255,.10)}
  .bigscore .u > div{margin-top:0 !important}

  /* --- kartu statistik: satu baris, tinggi seragam --- */
  .stats{display:flex !important;gap:var(--sp2) !important;padding:0 !important}
  .stat{flex:1;min-height:0 !important;text-align:center;display:flex;
    flex-direction:column;gap:var(--sp1);justify-content:center}
  .stat .lbl{font-size:11px;color:#9E9EA6;font-weight:600;letter-spacing:.02em;text-transform:none}
  .stat .num{font-size:22px;font-weight:800;color:#FFFFFF;line-height:1.15}
  .stat .si{display:none}

  /* --- judul seksi --- */
  .fh{font-size:14px !important;font-weight:500 !important;color:#CED3D9 !important;
    padding:0 !important;margin:0 !important}
  .fh + *{margin-top:var(--sp2) !important}

  /* --- segmen: BARIS, bukan kolom. emoji, label, persen sejajar; bar mengisi baris kedua --- */
  .segwrap{display:flex;flex-direction:column;gap:var(--sp4)}
  .seg{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp2);margin:0}
  .seg-emo{font-size:14px;flex:0 0 20px;text-align:center}
  .seg-lbl{font-size:14px;font-weight:500;color:#FFFFFF;flex:1;min-width:0}
  .seg-pct{font-size:14px;font-weight:700;flex:0 0 auto;font-variant-numeric:tabular-nums}
  .seg-bar{flex:1 1 100%;height:5px;border-radius:6px;background:#EEEFF1;margin:0;overflow:hidden}
  .seg-bar i{display:block;height:100%;border-radius:6px}

  /* --- tab filter --- */
  .tabs{display:flex;height:38px;background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.10);border-radius:12px;padding:var(--sp1);gap:2px;
    backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px)}
  .tab{flex:1;border:0;border-radius:8px;font-size:12px;font-weight:400;color:#FFFFFF;
    background:none;cursor:pointer;padding:0}
  .tab.on{background:rgba(237,237,237,.30);font-weight:700}

  /* --- kartu temuan --- */
  .find-hd{display:flex;gap:var(--sp2) !important;padding:0 !important;align-items:flex-start}
  .find .sic{width:24px !important;height:24px !important;flex:0 0 24px !important;
    border-radius:50%;font-size:12px;margin-top:0}
  .find .body{flex:1;min-width:0}
  .find .ttl{font-size:14px !important;font-weight:700 !important;color:#FFFFFF !important;line-height:1.4}
  .find .layer{font-size:12px !important;color:#9E9EA6 !important;
    font-family:var(--sans) !important;margin-top:var(--sp1) !important}
  .find .who,.find .kena{font-size:12px;color:#9E9EA6;margin-top:var(--sp1)}
  .find .chev{color:#9E9EA6;font-size:16px;flex:0 0 auto}
  .find .acts{padding:var(--sp3) 0 0 !important;margin-top:var(--sp3) !important;
    border-top:1px solid rgba(255,255,255,.10);gap:var(--sp2)}

  /* --- sidekick AKSA: beri napas, jangan mepet --- */
  .sidekick{color:#E8E8EC}
  .sidekick > * + *{margin-top:var(--sp3)}
  .sk-key{display:flex;gap:var(--sp2);align-items:center}
  .sk-key input{flex:1;padding:11px 12px !important;border-radius:12px !important;font-size:12px}
  .sk-btn{padding:11px 16px !important;border-radius:12px !important;white-space:nowrap}
  .sk-foot{margin-top:var(--sp2) !important;font-size:11px;line-height:1.5}

  /* --- kolom isian --- */
  input,textarea,select{background:rgba(255,255,255,.08) !important;color:#fff !important;
    border:1px solid rgba(255,255,255,.14) !important;font-family:var(--sans);
    padding:11px 12px !important;border-radius:12px !important}
  input::placeholder,textarea::placeholder{color:#7A7A86}
  .ctx-in{margin-top:var(--sp2) !important}
  ::selection{background:rgba(255,200,0,.28)}

  /* --- details "Atur journey" & "Urutan layar" --- */
  .atur summary{font-size:13px;font-weight:600;color:#fff;cursor:pointer;list-style:none}
  .atur-b{margin-top:var(--sp3)}
  .atur-b > * + *{margin-top:var(--sp2)}

  /* --- bar nav bawah: pil mengambang --- */
  .nav{position:relative;background:transparent !important;backdrop-filter:none !important;
    -webkit-backdrop-filter:none !important;border-top:0 !important;
    padding:var(--sp4) var(--sp5) 25px !important;gap:0 !important}
  .nav::before{content:"";position:absolute;left:var(--sp5);right:var(--sp5);top:var(--sp4);
    bottom:25px;border-radius:100px;background:rgba(255,255,255,.06);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);pointer-events:none}
  .nav button{position:relative;z-index:1;flex:1;border-radius:100px !important;
    padding:6px 8px 7px !important;gap:var(--sp1) !important;font-size:10px !important;
    font-weight:600 !important;color:#FFFFFF !important;background:transparent !important;
    box-shadow:none !important;border:0;cursor:pointer}
  .nav button.on{background:rgba(237,237,237,.20) !important}
  .nav button .ni{width:28px;height:28px;display:flex;align-items:center;justify-content:center}
  .nav button .ni svg{width:24px;height:24px;stroke:#FFFFFF}

  /* --- blok kecil yang dulu mepet --- */
  .empty{padding:var(--sp6) var(--sp4) !important;text-align:center;color:#9E9EA6}
  .thinking{padding:var(--sp3) var(--sp4) !important;border-radius:16px;
    background:rgba(255,255,255,.06);display:flex;gap:var(--sp2);align-items:center}
  .chips{gap:var(--sp2) !important}
  .modes{gap:var(--sp2) !important}

  /* ---------------------------------------------------------------
     Perbaikan state terpilih.
     Waktu tema dibalik, --ink berubah dari hitam jadi putih karena dia
     token TEKS. Tapi tiga aturan ini memakainya sebagai LATAR tombol
     terpilih, jadi latarnya ikut putih sementara teksnya tetap putih.
     Hasilnya putih di atas putih, rasio 1:1.
     Sekarang state terpilih ditulis eksplisit, tidak menumpang token teks.
     --------------------------------------------------------------- */
  .chip,.mode{background:rgba(255,255,255,.08) !important;
    border:1px solid rgba(255,255,255,.10) !important;color:#FFFFFF !important;
    border-radius:12px !important;padding:12px 14px !important;
    font-size:13px !important;font-weight:600 !important;cursor:pointer}
  .im-badge{background:var(--l2) !important;color:var(--ink) !important;
    border:1px solid var(--line);border-radius:var(--pill);padding:4px 10px;
    font-size:10.5px;font-weight:700;letter-spacing:.02em}

  /* tombol utama: merah merek dengan teks putih, bukan token teks */
  .mint,.sk-btn,.btn-primary,button.go{background:#E80022 !important;color:#FFFFFF !important;
    border:0 !important;font-weight:700 !important}
  .mint:hover,.sk-btn:hover{background:#FF0025 !important}

  /* tombol sekunder */
  .act,.btn,.reset{background:rgba(255,255,255,.08) !important;color:#FFFFFF !important;
    border:1px solid rgba(255,255,255,.14) !important}

  /* =====================================================================
     TIS v4 — skala tipografi dan komponen.
     Sepuluh tingkat saja. v1 punya delapan belas, dan setengahnya beda
     setengah piksel dari tetangganya, yang tidak terbaca sebagai hierarki.
     ===================================================================== */

  /* --- permukaan tetap, bukan alpha, supaya kontras bisa dihitung --- */
  .card,.find,.stat,.segwrap,.sidekick,.ctx,.rub,.bigscore,.atur{
    background:var(--surface) !important;
    border:1px solid var(--line) !important;
    border-radius:var(--r-lg) !important;
    padding:var(--sp4) !important;margin:0 !important;
    backdrop-filter:none !important;-webkit-backdrop-filter:none !important;
    box-shadow:none !important}
  .find.open,.rub .kids,.atur[open]{background:var(--l2) !important}

  /* --- SKOR: angka sebagai gambar, 56px --- */
  .bigscore{padding:var(--sp5) !important;text-align:left;position:relative;overflow:hidden}
  .bigscore .n{position:relative;font-size:56px;font-weight:800;line-height:.95;
    letter-spacing:-.045em;
    background:linear-gradient(180deg,var(--g1,#FFD84D),var(--g2,#B08A00));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .bigscore .t{position:relative;font-size:14px;font-weight:700;color:var(--ink);
    margin-top:var(--sp2);letter-spacing:-.02em}
  .bigscore .s{position:relative;font-size:12px;font-weight:600;margin-top:2px}
  .bigscore .c{position:relative;display:inline-block;margin-top:var(--sp3);
    font-size:11px;font-weight:600;color:var(--mut2);background:var(--l2);
    border-radius:var(--pill);padding:6px 12px}
  .bigscore .u{margin-top:var(--sp4);padding-top:var(--sp3);
    border-top:1px dashed var(--line2)}

  /* --- SATUAN MENEMPEL, kebiasaan GO Club --- */
  .un{font-size:.42em;font-weight:800;letter-spacing:-.02em;margin-left:1px}

  /* --- JUDUL DUA WARNA: yang diberi warna adalah bagian yang mengubah keputusan --- */
  .dual{font-size:24px;font-weight:800;letter-spacing:-.035em;line-height:1.15;color:var(--ink)}
  .dual em{font-style:normal}
  .dual.g em{color:var(--green)} .dual.a em{color:var(--amber)} .dual.r em{color:var(--red)}

  /* --- baris statistik tiga kolom --- */
  .v4stats{display:flex;gap:var(--sp4);margin-top:var(--sp4);padding-top:var(--sp4);
    border-top:1px dashed var(--line2)}
  .v4stats .c{flex:1}
  .v4stats .n{font-size:22px;font-weight:800;letter-spacing:-.03em;
    color:var(--ink);line-height:1.1}
  .v4stats .l{font-size:11px;font-weight:600;color:var(--mut2);margin-top:2px;letter-spacing:.02em}

  /* --- EMPTY STATE sebagai halaman, bukan catatan kecil --- */
  .empty{padding:var(--sp6) 0 var(--sp5) !important;text-align:left !important;background:none !important;
    border:0 !important}
  .empty .ok{display:none}
  .empty-h{font-size:32px;font-weight:800;letter-spacing:-.04em;line-height:1.02;color:var(--ink)}
  .empty-h em{font-style:normal;color:var(--mut2)}
  .empty-p{margin-top:var(--sp3);font-size:13px;font-weight:500;color:var(--mut);max-width:30ch;line-height:1.5}

  /* --- KARTU SOROT satu pesan, maksimal satu per layar --- */
  .shout{background:var(--hi);border-radius:var(--r-lg);padding:var(--sp5);border:0}
  .shout .h{font-size:18px;font-weight:800;letter-spacing:-.03em;line-height:1.2;color:var(--on-hi-1)}
  .shout .p{margin-top:var(--sp2);font-size:12.5px;font-weight:600;color:var(--on-hi-2);line-height:1.5}

  /* --- tipografi komponen --- */
  .fh{font-size:14px !important;font-weight:700 !important;color:var(--mut) !important;
    padding:0 !important;margin:0 !important;letter-spacing:0 !important;text-transform:none !important}
  .find .ttl{font-size:15px !important;font-weight:700 !important;color:var(--ink) !important;
    letter-spacing:-.02em;line-height:1.3}
  .find .layer{font-size:12px !important;font-weight:500 !important;color:var(--mut2) !important;
    font-family:var(--sans) !important;margin-top:var(--sp2) !important}
  .find .who,.find .kena{font-size:12px;font-weight:500;color:var(--mut2);margin-top:var(--sp1)}
  .find .sic{width:24px !important;height:24px !important;flex:0 0 24px !important;
    border-radius:50%;font-size:12px;font-weight:800;margin-top:0}
  .seg-lbl{font-size:14px !important;font-weight:600 !important;color:var(--ink) !important}
  .seg-pct{font-size:16px !important;font-weight:800 !important;letter-spacing:-.02em}
  .seg-bar{height:6px !important;border-radius:var(--pill) !important;background:var(--l2) !important}
  .seg-bar i{border-radius:var(--pill)}

  /* --- segmented & tab: terpilih memakai --inv, TIDAK menumpang token teks --- */
  .segtop{height:48px;background:var(--l2);border:1px solid var(--line);
    border-radius:var(--r-md);padding:var(--sp1);gap:2px;backdrop-filter:none}
  .segtop button{border-radius:var(--r-sm);font-size:14px;font-weight:600;color:var(--ink)}
  .segtop button.on{background:var(--inv);color:var(--on-inv);font-weight:800}
  .tabs{height:38px;background:var(--l2);border:1px solid var(--line);
    border-radius:var(--r-md);padding:var(--sp1);gap:2px;backdrop-filter:none}
  .tab{border-radius:var(--r-sm);font-size:12px;font-weight:600;color:var(--ink)}
  .tab.on{background:var(--inv);color:var(--on-inv);font-weight:800}

  /* --- chip & mode: sama, tidak menumpang token teks --- */
  .chip,.mode{background:var(--surface) !important;border:1px solid var(--line) !important;
    color:var(--ink) !important;border-radius:var(--r-md) !important;
    padding:12px 14px !important;font-size:13px !important;font-weight:600 !important}
  .chip.on,.mode.on{background:var(--inv) !important;border-color:var(--inv) !important;
    color:var(--on-inv) !important;font-weight:800 !important}

  /* --- tombol: merek hanya untuk aksi utama --- */
  .mint,.sk-btn.full{background:var(--tis) !important;color:#FFFFFF !important;
    border:0 !important;font-weight:700 !important;border-radius:var(--pill) !important}
  .act,.btn,.sk-btn{background:var(--l2) !important;color:var(--ink) !important;
    border:1px solid var(--line) !important;border-radius:var(--pill) !important;font-weight:700 !important}

  /* --- nav: pil mengambang, terpilih putih 20% bukan pekat --- */
  .nav{background:transparent !important;backdrop-filter:none !important;border-top:0 !important;
    padding:var(--sp3) var(--sp5) 22px !important;gap:2px !important;position:relative}
  .nav::before{content:"";position:absolute;left:var(--sp5);right:var(--sp5);
    top:var(--sp3);bottom:22px;border-radius:var(--pill);background:var(--l2);pointer-events:none}
  .nav button{position:relative;z-index:1;border-radius:var(--pill) !important;
    font-size:11px !important;font-weight:700 !important;color:var(--ink) !important;
    background:transparent !important;box-shadow:none !important;padding:10px 4px !important;gap:5px !important}
  .nav button.on{background:rgba(255,255,255,.20) !important}
  .nav button .ni svg{width:24px;height:24px;stroke:var(--ink)}

  /* --- top bar tetap tanpa latar --- */
  .top{background:transparent !important;backdrop-filter:none !important;border-bottom:0 !important;
    padding:var(--sp5) var(--sp4) var(--sp3) !important;gap:var(--sp3) !important}

  /* --- pemisah dalam kartu: garis putus, bukan garis penuh --- */
  .find .body,.rub .kids,.mutu{border-top-style:dashed !important;border-top-color:var(--line2) !important}

  /* ── v4 · irama segmen kesiapan ─────────────────────────────
     Satu ukuran jarak dipakai di semua tempat: 14px. Sebelumnya blok ini
     memakai lima angka berbeda (gap sp4, margin-top 2, padding summary 6/2,
     padding bawah kartu 6), dan yang dilipat malah tidak dapat jarak sama
     sekali karena <details> bukan flex, jadi gap induk tidak menyentuhnya. */
  .segwrap{padding:14px !important;gap:14px !important}
  .seg{row-gap:8px !important;column-gap:10px !important}
  .seg-emo{flex:0 0 20px}
  .seg-bar{height:6px !important;border-radius:6px !important}

  /* yang dilipat ikut irama yang sama */
  .seg-lain{display:flex;flex-direction:column;gap:14px;margin:0}
  .seg-lain > summary{list-style:none;cursor:pointer;margin:0;
    padding:14px 0 0;border-top:1px dashed var(--line);
    font-size:12px;font-weight:600;color:var(--mut);
    display:flex;align-items:center;gap:6px}
  .seg-lain > summary::-webkit-details-marker{display:none}
  .seg-lain > summary::before{content:"\25B8";font-size:9px;transition:transform .18s ease}
  .seg-lain[open] > summary::before{transform:rotate(90deg)}

  /* token: tombol sekunder dan baris status */
  .sk-btn.ghost{background:transparent !important;color:var(--ink) !important;
    border:1px solid var(--line) !important;font-weight:600 !important;flex:0 0 auto}
  .sk-tok{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);
    font-size:10.5px;color:var(--mut);font-family:var(--mono);
    display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .sk-lnk{margin-left:auto;background:none;border:0;padding:0;cursor:pointer;
    font-family:var(--sans);font-size:10.5px;font-weight:700;color:var(--ink);
    text-decoration:underline;text-underline-offset:2px}
  #wsInput{font-size:10.5px}

  .sk-detail{margin-top:10px;padding-top:8px;border-top:1px dashed var(--line)}
  .sk-detail summary{cursor:pointer;font-size:10.5px;font-weight:700;color:var(--mut);list-style:none}
  .sk-detail summary::-webkit-details-marker{display:none}
  .sk-detail summary::before{content:"\25B8 ";font-size:9px}
  .sk-detail[open] summary::before{content:"\25BE "}
  .sk-detail pre{margin:8px 0 0;font-family:var(--mono);font-size:10px;line-height:1.6;
    color:var(--ink);background:var(--l2);border-radius:8px;padding:10px;
    white-space:pre-wrap;word-break:break-all}

  .sk-hint{margin-top:8px}
  .sk-ok{font-size:11.5px;font-weight:700;color:var(--green);background:rgba(43,168,117,.14);
    border-radius:10px;padding:9px 11px;margin-bottom:10px;line-height:1.5}


  /* ── v4 · tab Alur ikut sistem spasi tunggal ────────────────────────
     Komentar di blok v2 bilang "inset samping dipegang satu tempat", tapi
     yang ikut cuma #app. Isi tab Alur ada di dalam .pad, dan di sana tiap
     blok masih mengatur dirinya sendiri: 2px samping, lalu 5/7/8/9/10/11/12
     px atas. Delapan nilai untuk satu hal yang sama.

     Yang bikin tombol menempel: .atur punya margin:0 !important dari aturan
     kartu, dan itu menghapus margin-top inline apa pun. Jadi kartu "Urutan
     layar" duduk persis di bawah tombol tanpa jarak sama sekali. Aturan di
     bawah ditaruh paling akhir supaya menang dari aturan kartu itu. */
  .pad > *{margin-left:0 !important;margin-right:0 !important}
  .pad > * + *{margin-top:var(--sp3) !important}
  /* yang memang milik elemen di atasnya, bukan blok berdiri sendiri */
  .pad > .ctx-hint,.pad > .thinking,.pad > .fh + *{margin-top:var(--sp2) !important}
  .pad > .fh{margin-top:var(--sp5) !important}
  .pad > .fh:first-child{margin-top:0 !important}
  /* tombol aksi utama diberi ruang, dia keputusan bukan bacaan */
  .pad > .sk-btn.full{margin-top:var(--sp4) !important}

  /* ── E3 Figma · tab Alur ────────────────────────────────────────────
     Diambil dari frame 558:6715. Nilai di bawah bukan tebakan:
     kartu radius 22 padding 16, jarak antar kartu 6, badge 22 radius 6,
     tab aktif border 2px ungu 600, tombol utama putih 10% teks ungu 100. */

  /* judul bagian: teks biasa 14 bold, bukan label huruf kapital kecil */
  .jh{font-size:14px;font-weight:700;color:var(--ink);line-height:1.45}

  /* kartu setup journey */
  .jset{background:var(--surface);border:1px solid var(--line);
    border-radius:22px;padding:16px}
  .jset-l{font-size:14px;color:var(--ink);line-height:1.45;margin-bottom:8px}
  .jset-l b{font-weight:700}
  .jset-l span{font-size:12px;font-weight:400;color:var(--ink)}
  .jset-in{width:100%;box-sizing:border-box;height:70px;resize:vertical;
    background:#FFFFFF;border:1px solid rgba(60,60,67,.24);border-radius:10px;
    padding:10px;font-family:var(--sans);font-size:12px;line-height:1.45;
    color:#0B1020}
  .jset-in::placeholder{color:#9E9EA6}
  .jset-in:focus{outline:2px solid var(--purple);outline-offset:1px}

  /* daftar langkah */
  .steps{display:flex;flex-direction:column;gap:6px}
  .step{display:flex;align-items:center;gap:12px;
    background:var(--surface);border:1px solid var(--line);
    border-radius:22px;padding:16px}
  .step.goal{border-color:rgba(112,85,231,.55)}
  /* badge sekaligus tombol titik mulai */
  .step-n{flex:0 0 22px;width:22px;height:22px;border-radius:6px;border:0;padding:0;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    font-family:var(--sans);font-size:12px;font-weight:700;
    background:#FFFFFF;color:#000C1F}
  .step-n.start{background:var(--blue);color:#FFFFFF}
  .step-n:hover{outline:2px solid var(--purple);outline-offset:1px}
  .step-b{flex:1;min-width:0;cursor:pointer}
  .step-t{font-size:14px;font-weight:500;color:var(--ink);line-height:1.45;
    overflow-wrap:anywhere}
  .step-t .tag{font-style:normal;font-size:12px;font-weight:700;color:var(--blue);
    margin-left:4px;white-space:nowrap}
  .step-m{font-size:12px;font-weight:400;color:var(--mut);line-height:1.45}
  /* pil "End Screen" */
  .endbtn{flex:0 0 auto;height:32px;padding:0 10px;border-radius:8px;cursor:pointer;
    background:rgba(255,255,255,.10);border:1px solid transparent;
    font-family:var(--sans);font-size:12px;font-weight:400;color:var(--ink);
    white-space:nowrap}
  .endbtn:hover{background:rgba(255,255,255,.16)}
  .endbtn.on{background:var(--purple);border-color:var(--purple);
    color:#FFFFFF;font-weight:700}

  /* tab mode analisis */
  .jtabs{background:transparent !important;border:0 !important;padding:0 !important;
    gap:8px !important;height:36px}
  .jtabs .tab{flex:1;height:36px;border-radius:8px;
    background:rgba(255,255,255,.10) !important;border:2px solid transparent !important;
    font-size:14px !important;font-weight:400 !important;color:var(--ink) !important;
    box-shadow:none !important;cursor:pointer}
  .jtabs .tab.on{border-color:var(--purple) !important;font-weight:400 !important}

  /* tombol aksi utama tab Alur */
  /* Satu aksi utama di layar ini, dan dia memang merah. Figma memberinya
     putih 10% teks ungu, tapi itu membuatnya setara dengan pil End Screen
     dan tab mode, padahal ini satu-satunya tombol yang menjalankan sesuatu. */
  .jbtn{width:100%;height:44px;border-radius:100px;cursor:pointer;
    background:var(--tis);border:0;
    font-family:var(--sans);font-size:13px;font-weight:700;color:#FFFFFF}
  .jbtn:hover{filter:brightness(1.08)}
  .jbtn:active{filter:brightness(.94)}
  /* aksi ulang: sekunder. Dulu kuning, sisa tema lama, dan warnanya
     bersaing dengan potensi yang memang kuning di tab lain. */
  .jbtn2{height:40px;padding:0 14px;border-radius:100px;cursor:pointer;
    background:var(--l2);border:1px solid var(--line);
    font-family:var(--sans);font-size:12px;font-weight:600;color:var(--ink);
    white-space:nowrap}
  .jbtn2:hover{background:rgba(255,255,255,.14)}

  /* ── kartu Journey Health + kontrol override ────────────────────── */
  .jv{background:var(--surface);border:1px solid var(--line);
    border-radius:22px;padding:16px}
  .jv-top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  /* Latar diisi inline per vonis (hijau, merah, kuning, abu). Nilai default di
     bawah ada supaya aturan ini berdiri sendiri dan penyapu kontras tidak
     melaporkan alarm palsu. Keempat warna vonis sudah diverifikasi lolos. */
  .jv-pill{font-size:11px;font-weight:800;letter-spacing:.03em;color:#0B1020;
    background:var(--mut);padding:5px 12px;border-radius:100px;white-space:nowrap}
  .jv-run{margin-left:auto;font-size:11px;font-weight:600;color:var(--mut);white-space:nowrap}
  .jv-h{font-size:14px;font-weight:700;color:var(--ink);line-height:1.4}
  .jv-h span{font-weight:400;color:var(--mut)}
  .jv-r{font-size:12px;color:var(--mut);line-height:1.5;margin-top:2px}
  .jv-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
  .jv-note{margin-top:12px;padding:10px 12px;border-radius:10px;line-height:1.5;
    font-size:12px;color:var(--amber);background:rgba(232,182,0,.10)}

  .ovr{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
  .ovr > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:6px;
    font-size:13px;font-weight:700;color:var(--ink)}
  .ovr > summary::-webkit-details-marker{display:none}
  .ovr > summary::after{content:"\25B8";margin-left:auto;font-size:10px;color:var(--mut)}
  .ovr[open] > summary::after{content:"\25BE"}
  .ovr-b{margin-top:12px;display:flex;flex-direction:column;gap:10px}
  .ovr-p{margin:0;font-size:12px;color:var(--mut);line-height:1.55}
  .ovr-in{width:100%;box-sizing:border-box;height:38px;padding:0 12px;
    background:var(--l2);border:1px solid var(--line);border-radius:10px;
    font-family:var(--sans);font-size:12px;color:var(--ink)}
  .ovr-in::placeholder{color:var(--mut2)}
  .ovr-in:focus{outline:2px solid var(--purple);outline-offset:1px}
  .ovr-a{display:flex;gap:8px}
  /* Dua keputusan yang setara beratnya, jadi keduanya garis luar.
     Kalau salah satu diisi penuh, dia terbaca sebagai jawaban yang benar. */
  .ovr-a button{flex:1;height:38px;border-radius:100px;cursor:pointer;
    background:transparent;font-family:var(--sans);font-size:12px;font-weight:700}
  .ovr-y{border:1px solid rgba(43,168,117,.55);color:var(--green)}
  .ovr-y:hover{background:rgba(43,168,117,.12)}
  .ovr-n{border:1px solid rgba(242,88,110,.55);color:var(--red)}
  .ovr-n:hover{background:rgba(242,88,110,.12)}

  /* bukti pengukuran kontras */
  .meas{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
  .meas > summary{list-style:none;cursor:pointer;font-size:11px;font-weight:700;color:var(--mut)}
  .meas > summary::-webkit-details-marker{display:none}
  .meas > summary::before{content:"\25B8 ";font-size:9px}
  .meas[open] > summary::before{content:"\25BE "}
  .meas table{width:100%;border-collapse:collapse;margin-top:8px;font-size:11px}
  .meas td{padding:4px 0;vertical-align:top;line-height:1.5}
  .meas td:first-child{color:var(--mut);width:44%;padding-right:8px}
  .meas td:last-child{font-family:var(--mono);color:var(--ink)}
  .meas td i{display:inline-block;width:10px;height:10px;border-radius:3px;
    margin-right:6px;vertical-align:-1px;border:1px solid var(--line)}
  .meas p{margin:8px 0 0;font-size:11px;color:var(--mut2);line-height:1.55}

  /* Atribut run, bukan vonis. Sengaja TIDAK berbentuk pil supaya tidak terbaca
     sebagai bagian dari partisi yang jumlahnya harus sama dengan total run. */
  .wv-atr{margin-top:6px;font-size:11.5px;color:var(--mut);line-height:1.5;
    padding-left:11px;border-left:2px solid var(--line)}

  .sk-tes{margin-top:8px;font-size:11.5px;font-weight:600;color:var(--amber)}
</style>
</head>

  // Ini jaring pengaman untuk kegagalan diam-diam, di mana aturan lepas tanpa memicu error.
  function knowledgeCheck(sources){
    // Tiga keadaan, bukan dua. Sumber yang belum tersedia BUKAN berarti aturannya lepas.
    //   ada    = jejak ditemukan di sumbernya
    //   hilang = sumbernya ada, tapi jejaknya tidak ada  -> masalah sungguhan
    //   belum  = sumbernya memang belum terisi           -> belum bisa diperiksa
    var hilang=[], belum=[], ada=0;
    KNOWLEDGE.kalibrasi.forEach(function(r){
      // "semua prompt" berarti SETIAP prompt, bukan salah satu. Dulu cukup satu prompt memuat
      // jejaknya, jadi aturan bisa lepas dari tiga prompt lain tanpa ketahuan.
      if(r.menyentuh==="semua prompt"){
        var daftar=(sources.daftarPrompt||[]).filter(Boolean);
        if(!daftar.length){ belum.push(r.id); return; }
        var lepas=daftar.filter(function(p){ return p.indexOf(r.jejak)<0; }).length;
        if(!lepas) ada++; else hilang.push(r.id+" ("+lepas+" prompt)");
        return;
      }
      var teks = (r.menyentuh==="generated") ? profilPromptBlock() : (sources[r.menyentuh]||"");
      if(!teks){ belum.push(r.id); return; }
      if(teks.indexOf(r.jejak)>=0) ada++; else hilang.push(r.id+" ("+r.menyentuh+")");
    });
    return { total:KNOWLEDGE.kalibrasi.length, ada:ada, hilang:hilang, belum:belum };
  }

    // terbaca lepas padahal utuh, dan itu jenis alarm palsu yang bikin lencana ini tidak dipercaya.
    var klausa = "";
    try{
      klausa = cmpClauseFor(["uji"]) +
               densClause([{ layar:"uji", sebab:"uji", berat:true }]) +
               // Klausa persona dan kendala ikut dirakit dari KNOWLEDGE, jadi diperiksa lewat pembangunnya.
               Object.keys(KNOWLEDGE.persona).map(personaClause).join(" ") + " " +
               Object.keys(KNOWLEDGE.kendala).map(kendalaClause).join(" ");

    try{ kodePersona = String(personaSummary); }catch(e){ kodePersona = ""; }
    return { SYS:SYS, FLOW_SYS:FLOW_SYS, TW_SYS:TW_SYS, SYNTH_SYS:SYNTH_SYS, PERSONA_SYS:PERSONA_SYS, klausa:klausa,

             daftarPrompt:[SYS,FLOW_SYS,TW_SYS,SYNTH_SYS,PERSONA_SYS],
             prompts:[SYS,FLOW_SYS,TW_SYS,SYNTH_SYS,PERSONA_SYS,klausa].join(" ") };

  function knowledgeBadge(){

    if(!r.ada && !r.hilang.length) return "";           // belum ada satu pun sumber, diam saja

  function profilPromptBlock(){
    var ids = Object.keys(KNOWLEDGE.profil);

      return s + ". ";
    }).join("");

      "'affected' HANYA boleh berisi ID dari daftar tetap ini, jangan mengarang istilah lain. " + daftar +

      "(b) Patuhi batasan 'BUKAN untuk' di atas. (c) Satu friksi boleh kena lebih dari satu profil, tapi jangan menandai semuanya kalau buktinya cuma untuk satu. "+

      "Tiap item 'fixes' JUGA wajib punya 'affected' sendiri, karena satu journey bisa punya beberapa friksi yang kena profil berbeda. ";
  }

    "KONSISTENSI, nilai DETERMINISTIK pakai ambang: 'aman' = tidak ada gesekan menuju tujuan; 'perlu-perhatian' = ada 1 gesekan tapi tujuan tetap tercapai; 'masalah' = ada gesekan yang bisa bikin user gagal/nyasar. Kalau ragu, pilih status LEBIH BURUK. Jangan variasikan hasil antar-scan untuk alur yang sama. "+
    "SARAN harus TAJAM & langsung dikerjakan, pola 3 bagian: (1) LAYAR/elemen mana, (2) PERUBAHAN konkret & spesifik (bukan 'perjelas' saja), (3) HASIL buat user. Contoh: 'Di layar 3 tambah stepper \"2 dari 3\" biar user tahu tinggal 1 langkah lagi, kurangi drop-off.' "+
    "ATURAN 'saran' (WAJIB): pola 3 bagian, (1) LAYAR ke-berapa & elemen mana, (2) PERUBAHAN konkret & spesifik (sebut komponen/teks/urutan barunya, mis. 'tambah stepper \"2 dari 3\" di header', 'gabung layar 3 & 4', 'tambah tombol \"Batalkan\"'), (3) HASIL buat user (mis. 'kurangi drop-off di tengah'). DILARANG vague seperti 'perjelas alur' / 'buat lebih mudah' tanpa aksi persis. "+
    "Balas HANYA JSON array, tanpa ``` dan tanpa teks lain: [{\"aspek\":\"efisiensi-langkah|goal-gradient|serial-position|konsistensi|jakob|user-control|error-prevention|error-recovery\",\"status\":\"aman|perlu-perhatian|masalah\",\"catatan\":\"sebut layar ke-berapa\",\"saran\":\"pola 3 bagian: layar+elemen + perubahan spesifik + hasil buat user\"}].";

  var TW_SYS = "PINTU ALTERNATIF (WAJIB, dicek SEBELUM memilih): di tiap layar, sebutkan dulu SEMUA label yang MASUK AKAL untuk task ini, bukan cuma yang paling mirip katanya. Kalau ada dua atau lebih label yang sama-sama masuk akal bagi orang awam, itu titik ragu, tandai confused=true walaupun akhirnya kamu memilih yang benar. DILARANG memilih sebuah opsi HANYA karena katanya mirip dengan kata di task. Orang awam tidak tahu istilah produk, jadi kemiripan kata bukan alasan yang sah. Contoh: untuk task soal internet lebih kencang, label \"Ganti Paket Utama\", \"Tambah Speed\", dan \"Tambah Jangkauan\" sama-sama masuk akal, jadi itu titik ragu. GAYA TULIS (WAJIB): DILARANG memakai tanda em dash (—) di teks apa pun yang kamu hasilkan (title, catatan, saran, alasan). Pakai koma, titik dua, tanda kurung, atau pecah jadi dua kalimat. Kamu memerankan PENGGUNA YANG PALING KESULITAN: orang Indonesia awam / lansia / literasi digital rendah yang mencoba menyelesaikan TASK lewat prototipe. INI PENTING: kamu BUKAN power-user dan TIDAK cerdas menavigasi. Aturan main WAJIB: PENTING, kamu BISA melihat screenshot tiap layar; NILAI dari TEKS TOMBOL/label yang BENERAN kelihatan di layar. Label opsi di peta sekarang diusahakan = TEKS ASLI elemen yang diklik (mis. 'Ganti Paket Utama → Detail paket'), jadi BOLEH kamu pakai untuk mencocokkan opsi mana yang sesuai task. TAPI kalau sebuah label opsi masih terlihat teknis (mis. 'Button/Primary', 'Frame 1321', '.menu-telco'), ABAIKAN label itu & pakai screenshot + daftar teks; peta tetap dipakai buat tahu tiap opsi mengarah ke layar mana. "+
    "(1) Di tiap layar, klik HANYA opsi yang LABEL-nya JELAS & LANGSUNG cocok dengan task. JANGAN menyimpulkan jalur multi-langkah tak intuitif; jangan pintar-pintar menebak bahwa 'dashboard → monitoring → kelola' mungkin mengarah ke tujuan. "+
    "(2) Kalau tidak ada opsi yang label-nya jelas cocok, kamu BINGUNG, pilih yang paling MIRIP walau salah (mis. 'Add-on' dikira 'ganti paket'), atau menyerah. "+
    "(3) Coba dengan wajar; kalau setelah LIHAT layar tetap tidak ada opsi yang jelas mengarah ke task, baru menyerah (gagal). Jangan backtrack cerdas seperti expert, tapi JANGAN juga menyerah kalau tombol yang benar sebetulnya JELAS terlihat di layar. "+
    "(4) Maks 8 langkah. Jujur, jangan mengarang jalan di luar peta. "+
    "VERDICT: 'berhasil' HANYA kalau jalurnya OBVIOUS & tiap langkah label-nya jelas cocok task. Kalau sampai tujuan TAPI lewat tebakan / jalur tak intuitif yang user awam kecil kemungkinan menemukan → verdict 'rapuh' (BUKAN berhasil). Kalau nyasar/menyerah → 'gagal' atau 'nyasar'. "+
    "REACHED GOAL ≠ BERHASIL (WAJIB): kalau user SAMPAI goal TAPI di tengah sempat BINGUNG/RAGU berarti, berhenti membandingkan lama, atau NYARIS salah pilih (mis. choice overload di layar keputusan) → verdict = 'rapuh', BUKAN 'berhasil'. ATURAN KERAS: kalau ADA langkah dengan confused=true, verdict MINIMAL 'rapuh' (tidak boleh 'berhasil'). 'berhasil' cuma buat journey yang benar-benar LANCAR tanpa keraguan berarti. Jadi verdict-mu harus KONSISTEN dengan langkah: kalau kamu menandai ada kebingungan, jangan bilang berhasil. "+
    "ANTI-HALU (WAJIB): (a) Kutip teks tombol/label/paket/layar PERSIS seperti terlihat. Kalau ragu teks persisnya, tulis '(teks tak terbaca)'. DILARANG KERAS mengarang nama tombol/paket/layar yang tidak ada (mis. tombol 'Golg' atau paket yang tak muncul). (b) Kamu BOLEH & PERLU menilai dari sisi user: apakah label JELAS & dimengerti awam, apakah aksi yang benar cukup MENONJOL sehingga gampang ditemukan (hierarki), dan apakah layar terlalu penuh / banyak pilihan mirip sehingga BINGUNG memilih (beban kognitif), karena itu yang menentukan gampang-tidaknya journey. (c) TAPI dasarkan HANYA pada yang benar-benar terlihat; JANGAN mengarang angka/detail teknis (ukuran px, rasio kontras, jarak 'berdekatan sekian') atau elemen yang tak ada, itu urusan scanner deterministik. Sampaikan kesulitan sebagai PENGALAMAN user ('aksi yang benar kurang menonjol jadi susah ketemu', 'kebanyakan pilihan mirip jadi bingung'), BUKAN klaim teknis. (d) Saat menyebut di mana tersesat, sebut NAMA LAYAR PERSIS + LABEL OPSI PERSIS yang benar-benar ada. (e) Kalau semua langkah lewat label jelas & aksi menonjol, katakan journey KOKOH, jangan cari-cari alasan. (f) Tiap layar dikasih daftar teks dalam 3 grup: TERLIHAT (user langsung lihat), DI BAWAH FOLD (ada tapi perlu scroll ke bawah), OFF-SCREEN SAMPING (ada tapi perlu swipe horizontal). SEMUA teks itu PASTI ADA di desain, DILARANG bilang sebuah label 'tidak ada' kalau ada di salah satu grup. TAPI user awam hanya LANGSUNG melihat yang di grup TERLIHAT. Pilihan klik tiap langkah harus dari daftar, dan utamakan yang TERLIHAT. "+
    "(g) DISCOVERABILITY (WAJIB, ini yang bikin journey rapuh walau flow-nya sebenarnya ada): user cuma bisa mengklik yang bisa dia TEMUKAN. (i) TERLIHAT → bisa langsung. (ii) DI BAWAH FOLD → user umumnya tahu bisa scroll ke bawah (konvensi kuat), OK; tapi kalau AKSI UTAMA terkubur jauh di bawah tanpa petunjuk → friksi (rapuh). (iii) OFF-SCREEN SAMPING → tergantung SIGNIFIER, nilai ADIL dua arah dari SCREENSHOT: "+
    "• ADA cue swipe → FAIR: kalau ada tanda area itu bisa di-swipe, elemen off-screen DIANGGAP BISA DIAKSES, JANGAN dihukum, langkah lewat situ WAJAR (boleh berhasil). Cue bisa berupa: item berikutnya NGINTIP/terpotong di tepi, indikator dots, ATAU IKON chevron/panah '>' / tombol scroll di UJUNG (kanan) baris, atau teks 'lihat semua'. CARI TELITI di ujung kanan baris scrollable, cue paling sering berupa IKON KECIL (chevron), bukan teks; JANGAN buru-buru bilang 'tak ada panah' sebelum benar-benar cek ujung baris. Selain screenshot, tiap layar juga dikasih daftar 'IKON/AFORDANSI terdeteksi' dari struktur, kalau di situ ADA chevron/panah/dots/scroll di 'tepi-kanan' atau dekat area yang punya item OFF-SCREEN SAMPING, ANGGAP itu SIGNIFIER (adil, off-screen bisa diakses), DILARANG bilang 'tak ada signifier'. "+
    "• TIDAK ADA cue (mis. tab rata penuh mengisi lebar, item terakhir mepet tepi, tak ada yang ngintip, tak ada dots/chevron) → user awam kemungkinan tak tahu bisa di-swipe → elemen off-screen kurang discoverable. Kalau aksi yang BENAR ada di situ → condong RAPUH. "+
    "KETERBATASAN ANALISA STATIS (WAJIB, rendah hati): kamu menilai dari FRAME DIAM, jadi kamu TIDAK bisa melihat cue RUNTIME, mis. micro-animation (tab bergeser sedikit saat load), bounce scroll, atau interaksi lain, dan vision-mu KADANG melewatkan ikon chevron kecil. Karena itu, kalau kamu TIDAK menemukan cue tapi ini area yang MUNGKIN scrollable, JANGAN pede vonis GAGAL, dan JANGAN nyalahin desain terlalu keras. Tandai sebagai kemungkinan discoverability issue yang PERLU DICEK MANUSIA (advisory), condong RAPUH bukan gagal, dan di 'issue' tulis jujur: 'aksi [X] off-screen; cue swipe (chevron/animasi) tidak terlihat di desain statis, perlu cek runtime/manusia'. "+
    "Intinya: kalau ada cue → adil (berhasil). Kalau cue tak terlihat → rapuh + tandai 'perlu cek manusia', bukan gagal telak. "+
    "JENIS LANGKAH (WAJIB dibedakan): (A) NAVIGASI = cari tombol lanjut yang jelas (dinilai pakai findability di atas). (B) KEPUTUSAN = MEMILIH di antara banyak opsi (mis. pilih paket di antara banyak kartu). Untuk langkah KEPUTUSAN, task baru BENAR-BENAR berhasil kalau user awam bisa YAKIN memilih opsi yang TEPAT untuk kebutuhannya, BUKAN sekadar bisa mengklik salah satu. Kalau opsinya BANYAK & MIRIP dengan differensiasi tidak jelas (mis. Promo / Internet Basic / Internet + Telepon / Internet + TV / Paket Complete + banyak kartu promo berjejer, plus filter harga/bonus) → user awam KEWALAHAN, ragu, butuh lama membandingkan, atau asal pilih/menebak (Hick's Law, choice overload, beban kognitif tinggi). Ini FRIKSI NYATA yang bikin user asli kesulitan di UT: tandai langkah itu confused=true dan condongkan verdict ke RAPUH (atau nyasar kalau sampai salah pilih), JANGAN cap 'berhasil mulus' cuma karena user bisa asal-klik satu kartu. Memilih dengan menebak karena kebanyakan opsi mirip = RAPUH, bukan berhasil. "+
    "KALIBRASI KEPUTUSAN (biar tidak asumsi/ambigu, PENTING): choice overload dihitung friksi HANYA kalau (1) task/intent-nya SPESIFIK (mis. 'beli paket 15GB', 'upgrade paket utama') DAN (2) opsi susah DIBEDAKAN pada atribut yang relevan untuk niat itu, sehingga user tak bisa yakin memilih yang TEPAT untuk NIATNYA. Kalau task-nya TERBUKA / eksplorasi (mis. 'pilih paket' tanpa kriteria) atau layar itu KATALOG buat cari-cari, maka banyak opsi itu WAJAR, memilih salah satu yang valid = task SELESAI (berhasil), JANGAN cap rapuh cuma karena banyak pilihan. DILARANG menilai 'mana opsi yang paling COCOK/terbaik' atau mengarang kebutuhan user/pelanggan (mis. 'bingung mana yang cocok untuk pelanggan') kalau kriteria itu TIDAK ADA di task/intent, kamu TIDAK tahu kebutuhan sebenarnya. Nilai selalu RELATIF ke niat yang tertulis, bukan ke kebutuhan/selera yang kamu karang. "+
    "AMBANG RAPUH untuk 'cari item spesifik di katalog/daftar' (WAJIB, ambang tinggi): MEMINDAI banyak kartu untuk menemukan target itu NORMAL & TETAP 'berhasil' walau perlu sedikit waktu. RAPUH HANYA kalau ada NEAR-DUPLICATE yang benar-benar MUDAH DIKELIRUKAN, yaitu dua opsi yang keliatan hampir identik dan cuma beda SATU atribut kecil (mis. '15GB 5 Hari' vs '15GB 10 Hari') sehingga user berisiko SALAH AMBIL yang mirip. Sekadar 'harus banding teliti' atau 'banyak pilihan' TANPA risiko salah-ambil yang nyata = BUKAN rapuh, itu berhasil. Kalau target gampang dibedakan (mis. satu-satunya yang '10 Hari', atau ada tab/filter yang nyaring ke sedikit hasil) = berhasil. Kalau nyebut rapuh, WAJIB tunjuk near-duplicate persis yang bikin salah-ambil, bukan alasan umum 'banyak kartu'. "+
    "COGNITIVE WALKTHROUGH, di TIAP langkah tanya 3 hal (Wharton): (1) NOTICE, apakah user awam akan MENYADARI aksi yang benar tersedia, atau tenggelam di antara banyak opsi / kurang menonjol? (2) MATCH (apakah user MENGHUBUNGKAN label itu dengan tujuannya? (3) FEEDBACK) setelah klik, ada tanda yang bikin yakin dia benar? "+
    "KERANGKA NORMAN (dasar cognitive walkthrough), tiap langkah nilai DUA jurang: (A) GULF OF EXECUTION: apakah user awam TAHU aksi apa yang harus diambil untuk maju ke tujuan, dan aksi itu tersedia & bisa dikenali dari yang terlihat? Kalau user harus MENEBAK cara bertindak → jurang eksekusi LEBAR. (B) GULF OF EVALUATION: setelah beraksi, apakah user bisa TAHU hasilnya (berhasil? sekarang di layar yang benar? apa langkah berikutnya?)? Kalau user tidak yakin aksinya berhasil / bingung ada di mana → jurang evaluasi LEBAR. Kalau salah satu jurang LEBAR di sebuah langkah, tandai confused=true; kalau lebar di langkah kritis → condong RAPUH/gagal. Di 'issue' sebut JURANG MANA yang lebar (eksekusi / evaluasi) + di layar apa. "+
    "URUTAN MENILAI tiap langkah (WAJIB): PERTAMA cari di antara SEMUA teks layar, label yang PALING LANGSUNG & tepat cocok dengan task. Kalau ADA label yang jelas & menonjol yang persis sesuai task (mis. task 'ganti/upgrade paket utama' → ada 'Ganti Paket Utama' tampil merah di kartu paket), maka user AWAM PASTI mengklik ITU, langkah itu MULUS/berhasil. JANGAN puas dengan match sebagian (mis. pilih 'Ganti' saja) kalau ada yang lebih tepat & menonjol, dan JANGAN cap rapuh cuma karena ada opsi lain di layar. "+
    "RAPUH (findability) HANYA kalau: label yang benar memang TENGGELAM / kecil / tidak menonjol / TIDAK ADA yang persis cocok, sehingga user harus MENEBAK. Kalau label yang tepat justru MENONJOL & jelas, itu BUKAN rapuh, itu berhasil. Jangan mengarang alasan rapuh untuk layar yang aksinya sudah jelas. "+
    "WIRING PROTOTYPE (penting, jangan salah vonis): kalau label yang paling tepat ADA & menonjol di layar TAPI tidak ter-wire di PETA (di prototype tidak mengarah ke mana pun), itu MASALAH WIRING prototype, BUKAN cacat UX. Jangan cap journey 'rapuh/gagal' karena UX, tapi tandai di 'issue': 'tombol [teks persis] sudah jelas & tepat, tapi belum di-wire di prototype', dan jangan pura-pura opsi lain yang lebih lemah adalah jalur yang dimaksud. "+
    "TANGGA VERDICT DARI KETERTEMUAN LABEL (WAJIB, ini yang paling sering salah): di TIAP langkah, tanya dulu 'apakah ada elemen yang TERLIHAT di layar ini yang labelnya menyatakan maksud task?'. "+
    "(1) Ada, dan menonjol → langkah ini mulus. (2) Ada, tapi tenggelam/kecil/ambigu → langkah ini RAPUH. "+
    "(3) TIDAK ADA satu pun label yang cocok dengan maksud task, sehingga kamu terpaksa MENEBAK (mis. mengklik blok info akun, banner, avatar, atau area tanpa label karena 'mungkin di sini') → langkah ini GAGAL, dan verdict run ini = 'gagal', BUKAN 'rapuh'. "+
    "Tandai langkah semacam itu dengan \"guessed\":true. 'rapuh' hanya untuk user yang RAGU tapi labelnya SEBENARNYA ADA. Kalau labelnya memang tidak ada dan kamu cuma beruntung menebak benar, user asli akan berhenti di situ, jadi itu GAGAL. "+
    "ANTI-BIAS PETA (WAJIB): kamu diberi PETA ALUR yang menunjukkan tiap opsi menuju layar mana. Peta itu HANYA untuk menerjemahkan nama layer jadi tujuan, BUKAN kunci jawaban. "+
    "DILARANG KERAS memilih sebuah elemen dengan alasan 'peta menunjukkan ini menuju goal'. Pilih HANYA berdasarkan apa yang TERBACA di layar oleh user yang belum pernah melihat aplikasi ini. "+
    "Kalau di layar tidak ada yang terbaca cocok, laporkan GAGAL walaupun peta memperlihatkan ada jalan tembus. User asli tidak memegang peta. Ingat: keberadaan jalur di prototype tidak sama dengan ketertemuan jalur oleh manusia. "+
    "Balas HANYA JSON: {\"reached_goal\":true/false,\"verdict\":\"berhasil|rapuh|gagal|nyasar\",\"path\":[\"Layar A\",\"Layar B\"],\"steps\":[{\"screen\":\"...\",\"chose\":\"...\",\"why\":\"alasan user 1 kalimat\",\"confused\":true/false,\"guessed\":true/false}],\"issue\":\"apa yang bikin gagal/rapuh / di mana user tersesat\",\"saran\":\"pola 3 bagian WAJIB: layar+elemen persis + perubahan konkret & spesifik (label/komponen/urutan baru, mis. ganti \\\"Add-on\\\" jadi \\\"Ganti Paket\\\") + hasil (task jadi ketemu); DILARANG vague\"}. Tanpa ``` dan tanpa teks lain.";

  var SYNTH_SYS = "GAYA TULIS (WAJIB): DILARANG memakai tanda em dash (—) di teks apa pun yang kamu hasilkan (title, catatan, saran, alasan). Pakai koma, titik dua, tanda kurung, atau pecah jadi dua kalimat. Kamu AKSA, UX researcher senior. Kamu dikasih hasil BEBERAPA kali walkthrough (AKSA berperan jadi user awam) untuk SATU journey. Tugasmu SINTESIS jadi analisis TAJAM & MENYELURUH, BUKAN mengulang satu run. Baca variasi antar-run: di mana user mulai beda jalan, di mana ragu/bingung, apa pola gagalnya. "+
    "GROUNDING (WAJIB): HANYA pakai FAKTA dari hasil run (jalur, pilihan 'chose', issue, langkah 'bingung') + nama layar/label yang muncul di situ. Kamu BOLEH menyimpulkan soal kejelasan label, penonjolan aksi (hierarki), dan beban kognitif SEJAUH didukung bukti run. TAPI DILARANG mengarang detail UI baru (nama tombol/paket/layar yang tak ada) atau angka teknis (ukuran px, kontras, jarak 'berdekatan'). Kalau bukti kurang, JANGAN klaim. Kalau semua run berhasil lewat label jelas, akui journey KOKOH, jangan cari-cari masalah. DILARANG menyimpulkan sebuah tombol/label 'tidak ada'; kalau susah ditemukan, sebut 'kurang menonjol', bukan 'tidak ada'. Kalau ada langkah KEPUTUSAN dengan banyak opsi mirip / differensiasi tidak jelas (choice overload, beban kognitif tinggi saat memilih paket), itu FRIKSI NYATA yang bikin user asli kesulitan di UT, JANGAN diperlakukan sebagai catatan minor dan JANGAN bilang journey 'kokoh' kalau memilih paket saja sudah bikin user awam kewalahan; angkat jadi root_cause / friction_point utama kalau muncul, TAPI hanya kalau task/intent SPESIFIK & opsi susah dibedakan pada atribut yang relevan; kalau task terbuka / layar katalog buat cari-cari, banyak opsi itu WAJAR, JANGAN cap friksi, JANGAN menilai 'mana yang paling cocok', dan JANGAN mengarang kebutuhan user/pelanggan yang tidak ada di task. Untuk 'cari item spesifik di katalog': memindai banyak kartu itu NORMAL (berhasil); friksi/rapuh HANYA kalau ada NEAR-DUPLICATE yang mudah dikelirukan (risiko SALAH AMBIL, mis. '15GB 5 Hari' vs '15GB 10 Hari'), bukan sekadar banyak opsi atau harus banding teliti. Kalau nyebut ini, tunjuk near-duplicate persisnya. DISCOVERABILITY: kalau ada run yang menemukan aksi lewat elemen OFF-SCREEN (perlu swipe/scroll) yang TIDAK ada signifier-nya, itu discoverability failure NYATA (flow-nya ada tapi user asli tak akan menemukannya), angkat jadi root_cause dan condongkan verdict ke rapuh/gagal, jangan dianggap mulus. Kalau relevan, sebut JURANG NORMAN di root_cause/friction_point: 'gulf of execution' (user tak tahu cara bertindak / aksi tak jelas) atau 'gulf of evaluation' (user tak tahu apakah aksinya berhasil / bingung sekarang di mana). "+
    "Titik broken harus EKSAK: sebut NAMA LAYAR PERSIS + LABEL/OPSI PERSIS tempat jalur putus atau user tersesat (ambil dari hasil run, bukan karangan). Rekomendasi KONKRET (elemen + perubahan spesifik + hasil), diurut dampak, JANGAN vague. Bahasa Indonesia, padat. "+
    "Balas HANYA JSON, tanpa ``` : {\"broken_at\":{\"screen\":\"nama layar PERSIS tempat putus/tersesat (kosong kalau kokoh)\",\"element\":\"label/opsi PERSIS yang jadi titik masalah (kosong kalau kokoh)\",\"why\":\"kenapa putus di situ, dari bukti run\"},\"friction_point\":\"1 kalimat titik friksi utama\",\"divergence\":\"di layar mana run mulai beda jalan & kenapa (kosongkan kalau semua run konsisten)\",\"failure_modes\":[\"pola gagal/rapuh dari bukti run, tiap item 1 kalimat\"],\"root_cause\":\"akar masalah 1-2 kalimat spesifik & grounded\",\"affected\":[\"vision|blind|lowlit|motor\"],\"confidence\":\"tinggi|sedang|rendah, alasan dari konsistensi run\",\"top_fix\":{\"what\":\"SATU perbaikan akar paling berleverage\",\"impact\":\"blocker/friksi apa saja yang ikut teratasi kalau ini dibenahi\"},\"fixes\":[{\"what\":\"elemen + perubahan konkret\",\"why\":\"kenapa\",\"expected\":\"hasil buat user\",\"tier\":\"blocker|friksi|polish\",\"certainty\":\"yakin|perlu-cek\",\"evidence\":\"walkthrough+heuristik|walkthrough|heuristik\",\"affected\":[\"vision|blind|lowlit|motor\"]}]}. 'fixes' 2-4 item. 'failure_modes' maks 3. "+
    "KONSISTENSI INTERNAL (WAJIB, ini sering dilanggar): jawabanmu tidak boleh bertentangan dengan dirinya sendiri maupun dengan 'FAKTA TERHITUNG' yang diberikan. "+
    "(a) DILARANG menulis di 'confidence' bahwa jalur 'identik / konsisten / sama persis di semua run' kalau jumlah JALUR BERBEDA lebih dari 1, atau kalau ada run yang punya langkah 'bingung'. Itu bertabrakan dengan data. "+
    "(b) DILARANG menyebut 'failure_modes' atau 'divergence' yang terjadi di run tertentu, lalu di kalimat lain mengklaim semua run seragam. Pilih satu yang benar sesuai data. "+
    "(c) Kalau SEMUA run berhasil DAN jalurnya cuma 1 macam DAN tak ada langkah bingung, maka journey memang KOKOH: kosongkan 'failure_modes' dan 'broken_at', jangan mengarang kerentanan supaya terlihat teliti. "+

      var timer = ctl ? setTimeout(function(){ ctl.abort(); }, API_TIMEOUT_MS) : null;
      return fetch(URL,{ method:"POST", headers:authHeaders(), body:bodyStr, signal:(ctl?ctl.signal:undefined) })
        .then(function(r){ return r.text().then(function(t){ if(timer) clearTimeout(timer); return {r:r,t:t}; }); },

        .then(function(res){

            var ra=parseFloat((res.r.headers && res.r.headers.get && res.r.headers.get("retry-after"))||"");

  function validNode(id){ if(!id)return false; for(var i=0;i<nodeMap.length;i++) if(nodeMap[i].id===id) return true; return false; }
  function normTxt(s){ return String(s==null?"":s).replace(/^["'\s]+|["'\s]+$/g,"").toLowerCase().replace(/\s+/g," ").trim(); }
  // cocokin temuan AI ke node lewat TEKS (lebih kokoh drpd percaya id dari AI)
  function resolveNode(a){
    var tt=normTxt(a.target_text);

  // Clipboard di iframe Figma: navigator.clipboard sering diblokir → pakai textarea + execCommand (butuh user gesture)
  function copyText(t){
